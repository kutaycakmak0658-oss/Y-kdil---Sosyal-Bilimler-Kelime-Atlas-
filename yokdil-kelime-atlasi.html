  function dialogFrame(title, description, body) {
    return `<div class="dialog-inner"><div class="dialog-head"><div><h2 id="dialog-title">${title}</h2>${description ? `<p>${description}</p>` : ''}</div>
      ${iconButton('Pencereyi kapat', 'close-dialog', 'x')}</div>${body}<p class="form-error" id="dialog-error" role="alert" hidden></p></div>`;
  }

  function wordDialog(word, result) {
    const existing = Boolean(word);
    const progress = result ? `<p class="subtext">${amount(result.total)} soru · ${amount(result.correct)} doğru · ${amount(result.wrong)} yanlış · ${pct(result.rate)} başarı<br>
        Son soru ${esc(dateShort.format(new Date(result.last)))} · Sıradaki tekrar ${esc(dateShort.format(new Date(result.due)))}</p>` : '';
    return dialogFrame(existing ? 'Kelimeyi düzenle' : 'Kelime ekle',
      'Birden fazla anlamı virgülle veya yeni satırla ayırabilirsin.',
      `<form id="word-form" class="form-stack" data-id="${existing ? esc(word.id) : ''}">
        <label class="field-label">İngilizce kelime<input name="english" class="field" lang="en" autocomplete="off" maxlength="200" value="${esc(word?.english)}" placeholder="abandon" required autofocus></label>
        <label class="field-label">Türkçe karşılık<textarea name="turkish" class="field" rows="3" maxlength="1200" placeholder="terk etmek" required>${esc(word?.turkish)}</textarea></label>
        ${progress}<div class="dialog-actions">${button('Vazgeç', 'close-dialog', 'secondary')}<button class="btn primary" type="submit">Kaydet</button></div>
      </form>`);
  }

  function importDialog(state) {
    const preview = state.preview;
    const source = state.importSource;
    const controls = source === 'file'
      ? `<label class="import-file">${icon('upload')} CSV veya Excel dosyası seç<small>Numbers → Dosya → Şuraya Aktar → CSV veya Excel</small>
        <input class="sr-only" id="file-import" type="file" accept=".csv,.tsv,.xlsx,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></label>`
      : `<form id="paste-form" class="form-stack"><label class="field-label">Her satıra bir kelime ve anlamı<textarea class="field" rows="5" name="pairs" placeholder="abandon = terk etmek&#10;assess = değerlendirmek" required>${esc(state.paste)}</textarea></label>
        <div>${'<button class="btn secondary" type="submit">Önizle</button>'}</div></form>`;
    const summary = !preview ? '' : importPreview(state);
    return dialogFrame('Kelimeleri içe aktar', 'Kaydetmeden önce satırları kontrol et.',
      `<div class="segmented" aria-label="İçe aktarma yöntemi">
      <button type="button" data-action="import-source" data-source="file" aria-pressed="${source === 'file'}">Dosya yükle</button>
      <button type="button" data-action="import-source" data-source="paste" aria-pressed="${source === 'paste'}">Metin yapıştır</button></div>
      ${controls}<div id="import-preview">${summary}</div>`);
  }

  function importPreview(state) {
    const { preview, view } = state;
    const seen = new Set();
    let duplicates = 0;
    for (const pair of preview.pairs) {
      if (seen.has(pair.key) || view.keys.has(pair.key)) duplicates++;
      seen.add(pair.key);
    }
    const rows = preview.pairs.slice(0, 12).map(pair => `<tr><td lang="en">${esc(pair.english)}</td><td class="translation">${esc(pair.turkish)}</td><td>${view.keys.has(pair.key) ? 'Mevcut' : ''}</td></tr>`).join('');
    const errors = preview.errors.length ? `<p class="form-error">${amount(preview.errors.length)} satır aktarılamadı.
      ${preview.errors.slice(0,3).map(error => 'Satır ' + error.line + ' · ' + esc(error.message)).join(' ')}</p>` : '';
    return `<p class="subtext" style="margin-top:13px"><strong>${esc(preview.label)}</strong> · ${amount(preview.pairs.length)} geçerli satır${duplicates ? ' · ' + amount(duplicates) + ' tekrar' : ''}</p>
      ${preview.header ? `<p class="subtext">İngilizce sütunu ${esc(preview.columns[0])} · Türkçe sütunu ${esc(preview.columns[1])}</p>` : ''}
      ${rows ? `<div class="preview-table"><table class="pool-table"><thead><tr><th>İngilizce</th><th>Türkçe</th><th>Durum</th></tr></thead><tbody>${rows}</tbody></table></div>` : ''}
      ${preview.pairs.length > 12 ? '<p class="subtext">Önizleme ilk 12 geçerli satırı gösteriyor.</p>' : ''}${errors}
      <form id="import-form" class="form-stack"><label class="field-label">Aynı İngilizce kelime varsa
        <select class="field" name="mode"><option value="keep">Mevcut karşılığı koru</option><option value="update">Dosyadaki son karşılıkla güncelle</option></select></label>
        <div class="dialog-actions"><button class="btn primary" type="submit" ${preview.pairs.length ? '' : 'disabled'}>Geçerli Satırları Aktar</button></div>
      </form>`;
  }

  function confirmDialog(title, description, action, label, extra = '', danger = false) {
    return dialogFrame(title, description, `<div class="dialog-actions">${button('Vazgeç','close-dialog','secondary')}${button(label, action, danger ? 'danger' : 'primary','',extra)}</div>`);
  }

  function reportDialog(question) {
    const choices = question.choices.map((text,index) => index === question.correct ? '' :
      `<label class="report-option"><input type="checkbox" name="option" value="${index}">${esc(text)}</label>`).join('');
    return dialogFrame('Hatalı soruyu işaretle', 'Geçerli olabilecek veya belirsiz bulduğun şıkları seç. Seçtiğin şıklar bu kelime için elenir.',
      `<form id="report-form">${choices}<div class="dialog-actions">${button('Vazgeç','close-dialog','secondary')}<button type="submit" class="btn primary">Soruyu İşaretle</button></div></form>`);
  }

  return {
    NAV, esc, amount, icon, button, shell, cloudChip, wordTable, availability,
    dialogFrame, wordDialog, importDialog, importPreview, confirmDialog, reportDialog
  };
})();


'use strict';

(() => {
  const core = AtlasCore;
  const ui = AtlasUI;
  const root = document.getElementById('app');
  const modal = document.getElementById('dialog');
  const toast = document.getElementById('toast');
  const systemTheme = matchMedia('(prefers-color-scheme: dark)');
  const savedPage = AtlasCloud.read('atlas:page');
  const savedTheme = AtlasCloud.read('atlas:theme');
  const state = {
    page: Object.hasOwn(ui.NAV, savedPage) ? savedPage : 'home',
    theme: ['system', 'light', 'dark'].includes(savedTheme) ? savedTheme : 'system',
    effectiveTheme: 'light', config: null, client: null, profile: null, store: null,
    active: null, data: null, view: null, hasLocal: false, recovery: false,
    sync: { running: false, last: 0, pending: 0, error: '' },
    mode: 'mixed', count: '10', custom: '15', query: '', wordSort: 'newest', wordPage: 1, wrongPage: 1,
    span: 7, importSource: 'file', paste: '', preview: null, restore: null, dialog: null
  };
  const channel = typeof BroadcastChannel === 'function' ? new BroadcastChannel('kelime-atlasi:degisiklik') : null;
  const syncJobs = new Map();
  const idPattern = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  let userWork = false, toastTimer, syncTimer, readSerial = 0, searchTimer;

  function setTheme() {
    state.effectiveTheme = state.theme === 'system' ? (systemTheme.matches ? 'dark' : 'light') : state.theme;
    document.documentElement.dataset.theme = state.effectiveTheme;
    document.querySelector('meta[name="theme-color"]').content = state.effectiveTheme === 'dark' ? '#151420' : '#f7f7fb';
  }

  function render() {
    if (state.data) root.innerHTML = ui.shell(state);
  }

  function updateChip() {
    const element = document.getElementById('cloud-chip');
    if (element) element.innerHTML = ui.cloudChip(state);
  }

  function inform(message, error = false) {
    if (modal.open && error) {
      const output = document.getElementById('dialog-error');
      if (output) {
        output.textContent = message;
        output.hidden = false;
        return;
      }
    }
    clearTimeout(toastTimer);
    toast.textContent = message;
    toast.classList.toggle('error', error);
    toast.hidden = false;
    toastTimer = setTimeout(() => { toast.hidden = true; }, error ? 6800 : 4000);
  }

  function openDialog(kind, contents) {
    state.dialog = kind;
    modal.innerHTML = contents;
    if (!modal.open) modal.showModal();
  }

  function closeDialog() {
    if (modal.open) modal.close();
    state.dialog = null;
    state.restore = null;
    state.preview = null;
  }

  function navigate(page, focus = true) {
    if (!Object.hasOwn(ui.NAV, page)) return;
    const previous = state.page;
    state.page = page;
    AtlasCloud.save('atlas:page', page);
    if (previous !== page) window.scrollTo(0, 0);
    render();
    if (focus) document.getElementById('main')?.focus({ preventScroll: true });
  }

  async function run(work, element) {
    if (userWork) return;
    userWork = true;
    const errorOutput = document.getElementById('dialog-error');
    if (errorOutput) errorOutput.hidden = true;
    if (element?.matches('button, input, select')) {
      element.disabled = true;
      element.setAttribute('aria-busy', 'true');
    }
    try {
      await work();
    } catch (error) {
      inform(error.name === 'QuotaExceededError' ? 'Bu cihazda kayıt alanı doldu. Yer açtıktan sonra tekrar dene.' : error.message, true);
      if (error.message?.startsWith('Test başka bir sekmede')) {
        closeDialog();
        await refresh();
        render();
      }
    } finally {
      if (element?.isConnected && element.hasAttribute('aria-busy')) {
        element.disabled = false;
        element.removeAttribute('aria-busy');
      }
      userWork = false;
    }
  }

  async function refresh(store = state.store) {
    const request = ++readSerial;
    const records = await store.read();
    if (state.store !== store || request !== readSerial) return false;
    state.active = records.active;
    state.view = AtlasStorage.viewFrom(records);
    state.data = core.stats(state.view);
    state.sync.pending = records.outbox.length;
    return true;
  }

  async function localStore() {
    const store = await AtlasStorage.open('local');
    const now = new Date().toISOString();
    await store.seed(ATLAS_STARTER.map(word => ({
      ...word, created_at: now, updated_at: now, deleted_at: null, merged_into: null
    })));
    return store;
  }

  async function activate(client) {
    const profile = client?.session ? client.profile() : 'local';
    const store = profile === 'local' ? await localStore() : await AtlasStorage.open(profile);
    state.profile = profile;
    state.store = store;
    state.storageKind = store.kind;
    state.sync = { running: false, last: 0, pending: 0, error: '' };
    state.hasLocal = false;
    if (profile !== 'local') {
      const local = await (await localStore()).read();
      state.hasLocal = local.words.length > 0;
    }
    state.query = '';
    state.wordPage = state.wrongPage = 1;
    await refresh(store);
    render();
    if (profile !== 'local') queueSync(0);
  }

  function queueSync(delay = 650) {
    clearTimeout(syncTimer);
    if (state.client?.session && state.profile !== 'local') {
      syncTimer = setTimeout(() => synchronize(), delay);
    }
  }

  function syncRender() {
    if (userWork || document.activeElement?.matches('input,textarea,select') || state.page === 'settings') {
      updateChip();
    } else {
      render();
    }
  }

  async function synchronize(manual = false) {
    const { client, store, profile } = state;
    if (!client?.session || !store || profile === 'local') return;
    if (syncJobs.has(profile)) return syncJobs.get(profile);
    if (!navigator.onLine) {
      state.sync.error = 'Çevrimdışısın. Bağlandığında bekleyen kayıtlar eşitlenecek.';
      if (manual) inform(state.sync.error, true);
      updateChip();
      return;
    }
    state.sync.running = true;
    updateChip();
    const job = (async () => {
      try {
        const operation = () => AtlasStorage.synchronize(store, client);
        const result = await (navigator.locks?.request('atlas-sync:' + profile, operation) ?? operation());
        if (state.store !== store) return;
        const wasError = state.sync.error;
        state.sync.last = Date.now();
        state.sync.error = '';
        if (result.changed || manual || wasError) {
          await refresh(store);
          if (result.changed) channel?.postMessage(profile);
        }
        if (result.failures.length) {
          inform(ui.amount(result.failures.length) + ' kayıt buluttaki güncel verilerle çakıştığı için uygulanamadı. Havuzu kontrol et.', true);
        } else if (manual) {
          inform('Eşitleme tamamlandı.');
        }
        if (state.sync.pending) queueSync(200);
        if (state.page === 'settings' && !document.activeElement?.matches('input,textarea,select')) render();
        else if (result.changed) syncRender();
      } catch (error) {
        if (state.store !== store) return;
        state.sync.error = error.message;
        if (manual) inform(error.message, true);
        if (state.page === 'settings' && !document.activeElement?.matches('input,textarea,select')) render();
      } finally {
        syncJobs.delete(profile);
        if (state.store === store) {
          state.sync.running = false;
          updateChip();
          const button = document.querySelector('button[data-action="sync"]');
          if (button) button.disabled = false;
        }
      }
    })();
    syncJobs.set(profile, job);
    return job;
  }

  async function commit(changes, nextTest, changeTest = false) {
    const store = state.store;
    const previous = state.active;
    const testChange = changeTest ? {
      previous, next: nextTest ? { ...nextTest, version: (previous?.version ?? 0) + 1 } : null
    } : undefined;
    const operations = changes.map(change => ({ ...change, id: core.uuid() }));
    await store.write(operations, state.profile !== 'local', testChange);
    await refresh(store);
    render();
    channel?.postMessage(state.profile);
    if (operations.length) queueSync();
  }

  function startMode(mode) {
    if (!Object.hasOwn(core.MODES, mode)) return;
    state.mode = mode;
    navigate('test');
    if (state.active && !state.active.finished) {
      inform('Yeni bir test türü seçmek için önce açık testi bitir.');
    } else if (state.active?.finished) {
      run(() => commit([], null, true));
    }
  }

  async function startTest(form) {
    const fields = new FormData(form);
    const mode = fields.get('mode');
    const count = fields.get('count') === 'custom' ? Number(fields.get('custom')) : Number(fields.get('count'));
    state.data = core.stats(state.view);
    const test = core.makeTest(state.data, mode, count);
    if (!test.questions.length) {
      const candidates = core.eligible(state.data, mode).length;
      throw new Error(candidates ? 'Dört farklı ve geçerli seçenek bulunamadı. Havuzuna farklı anlamlara sahip kelimeler ekle.' :
        'Bu test türü için uygun kelime yok. Başka bir test türü seç.');
    }
    await commit([], test, true);
    if (test.questions.length < count) {
      inform(ui.amount(count) + ' soru istedin. Geçerli seçeneklerle ' + ui.amount(test.questions.length) + ' soru hazırlandı.');
    }
    document.getElementById('question-word')?.focus({ preventScroll: true });
  }

  function currentQuestion() {
    const active = state.active;
    return active && !active.finished ? active.questions[active.position] : null;
  }

  async function answer(index) {
    const active = state.active;
    const question = currentQuestion();
    if (!question || active.results[question.id] || state.view.reports.has(question.id) || !question.choices[index]) return;
    const correct = index === question.correct;
    await commit([{
      kind: 'answer', data: { id: question.id, word_id: question.word_id, answered_at: new Date().toISOString(), correct, test_id: active.id }
    }], { ...active, results: { ...active.results, [question.id]: { selected: index, correct } } }, true);
    root.querySelector('[data-action="next"]')?.focus({ preventScroll: true });
  }

  async function mark(form) {
    const active = state.active;
    const question = currentQuestion();
    if (!question || state.view.reports.has(question.id)) return;
    const indexes = new FormData(form).getAll('option').map(Number);
    const options = [...new Set(indexes)].filter(index => index !== question.correct && question.choices[index])
      .map(index => question.choices[index]);
    if (!options.length) throw new Error('Belirsiz bulduğun en az bir şıkkı seç.');
    await commit([{
      kind: 'report', data: { id: question.id, word_id: question.word_id, created_at: new Date().toISOString(), options }
    }], { ...active, results: { ...active.results, [question.id]: { ...active.results[question.id], reported: true } } }, true);
    closeDialog();
    root.querySelector('[data-action="next"]')?.focus({ preventScroll: true });
  }

  async function advance() {
    const active = state.active;
    const question = currentQuestion();
    if (!question || !(active.results[question.id] || state.view.reports.has(question.id))) return;
    const finished = active.position + 1 >= active.questions.length;
    await commit([], { ...active, position: finished ? active.position : active.position + 1, finished }, true);
    (document.getElementById('question-word') || document.getElementById('main'))?.focus({ preventScroll: true });
  }

  async function saveWord(form) {
    const fields = new FormData(form);
    const pair = core.cleanPair(fields.get('english'), fields.get('turkish'));
    const id = form.dataset.id;
    const matching = state.view.keys.get(core.englishKey(pair.english));
    if (matching && matching !== id) throw new Error('Bu İngilizce kelime havuzunda zaten var. İstersen mevcut kaydı düzenle.');
    const at = new Date().toISOString();
    const change = id ? { kind: 'edit', data: { id, ...pair, updated_at: at } }
      : { kind: 'add', mode: 'keep', data: core.makeWord(pair, at) };
    await commit([change]);
    closeDialog();
    inform(id ? 'Kelime güncellendi.' : 'Kelime havuza eklendi.');
  }

  function showImport(source = 'file') {
    state.importSource = source;
    openDialog('import', ui.importDialog(state));
  }

  function displayPreview(parsed, label) {
    state.preview = { ...parsed, label };
    const preview = document.getElementById('import-preview');
    if (preview) preview.innerHTML = ui.importPreview(state);
  }

  async function importWords(form) {
    if (!state.preview?.pairs.length) return;
    const mode = new FormData(form).get('mode') === 'update' ? 'update' : 'keep';
    const plan = core.planImport(state.preview.pairs, state.view.keys, mode);
    await commit(plan.changes);
    closeDialog();
    const parts = [ui.amount(plan.added) + ' yeni kelime eklendi.'];
    if (plan.existing) parts.push(ui.amount(plan.existing) + (mode === 'update' ? ' karşılık güncellendi.' : ' mevcut kayıt korundu.'));
    if (plan.repeats) parts.push(ui.amount(plan.repeats) + ' dosya içi tekrar birleştirildi.');
    inform(parts.join(' '));
  }

  function download(blob, extension, prefix = 'kelime-atlasi') {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = prefix + '-' + core.dayKey(Date.now()) + '.' + extension;
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60_000);
  }

  function backupFrom(view) {
    return {
      format: 'kelime-atlasi', version: 1, saved_at: new Date().toISOString(),
      words: [...view.words.values()], answers: [...view.answers.values()], reports: [...view.reports.values()]
    };
  }

  function backupChanges(backup) {
    const validId = value => typeof value === 'string' && idPattern.test(value);
    const validDate = value => typeof value === 'string' && /^\d{4}-\d\d-\d\dT/.test(value) && Number.isFinite(Date.parse(value));
    if (backup?.format !== 'kelime-atlasi' || backup.version !== 1 ||
        !['words','answers','reports'].every(name => Array.isArray(backup[name]))) {
      throw new Error('Kelime Atlası biçiminde bir JSON yedeği seç.');
    }
    const ids = new Map();
    const changes = [];
    for (const word of backup.words) {
      if (!validId(word?.id) || ids.has(word.id) || !validDate(word.created_at) || (word.deleted_at && !validDate(word.deleted_at)) ||
          (word.merged_into && !validId(word.merged_into))) {
        throw new Error('Yedekte geçersiz kelime kimliği veya tarih var.');
      }
      const pair = core.cleanPair(word.english, word.turkish);
      ids.set(word.id, word);
      if (!word.merged_into && !state.view.words.has(word.id)) {
        changes.push({ kind: 'add', mode: 'keep', data: {
          id: word.id, ...pair, created_at: word.created_at, updated_at: word.created_at,
          deleted_at: word.deleted_at || null, merged_into: null
        } });
      }
    }

    function parent(id) {
      const item = ids.get(id);
      const canonical = item?.merged_into ? ids.get(item.merged_into) : item;
      if (!canonical || canonical.merged_into) throw new Error('Yedekte bir kelimenin bağlantılı kaydı eksik.');
      return canonical.id;
    }
    for (const record of backup.answers) {
      if (!validId(record?.id) || !validId(record.word_id) || !validId(record.test_id) ||
          !validDate(record.answered_at) || typeof record.correct !== 'boolean') throw new Error('Yedekte geçersiz cevap kaydı var.');
      const wordId = parent(record.word_id);
      if (!state.view.answers.has(record.id)) {
        changes.push({ kind: 'answer', data: {
          id: record.id, word_id: wordId, test_id: record.test_id, answered_at: record.answered_at, correct: record.correct
        } });
      }
    }
    for (const record of backup.reports) {
      if (!validId(record?.id) || !validId(record.word_id) || !validDate(record.created_at) || !Array.isArray(record.options) ||
          record.options.length < 1 || record.options.length > 3 ||
          record.options.some(option => typeof option !== 'string' || option.length < 1 || option.length > 1200 || /[\u0000-\u001f]/.test(option))) {
        throw new Error('Yedekte geçersiz soru bildirimi var.');
      }
      const wordId = parent(record.word_id);
      if (!state.view.reports.has(record.id)) {
        changes.push({ kind: 'report', data: {
          id: record.id, word_id: wordId, created_at: record.created_at, options: record.options
        } });
      }
    }
    const unique = new Map();
    for (const change of changes) unique.set(change.kind + ':' + change.data.id, change);
    return [...unique.values()];
  }

  function showRestore() {
    openDialog('restore', ui.dialogFrame('Yedeği içe aktar', 'Yedek kayıtların mevcut çalışmana eklenir. Eşleşen kelimelerin mevcut karşılıkları korunur.',
      '<label class="import-file">Kelime Atlası JSON dosyası seç<input id="restore-file" class="sr-only" type="file" accept=".json,application/json"></label><div id="restore-summary"></div>'));
  }

  async function restoreBackup() {
    if (!state.restore) return;
    const changes = backupChanges(state.restore);
    await commit(changes);
    closeDialog();
    inform(changes.length ? 'Yedekteki kayıtlar eklendi.' : 'Yedekteki kayıtlar zaten mevcut.');
  }

  function reauthDialog() {
    const email = state.client.session.user.email;
    openDialog('reauth', ui.dialogFrame('Hesabına yeniden giriş yap', '', `
      <form id="reauth-form" class="form-stack"><label class="field-label">E-posta<input name="email" class="field" type="email" value="${ui.esc(email)}" autocomplete="username" readonly></label>
      <label class="field-label">Parola<input name="password" type="password" class="field" autocomplete="current-password" required autofocus></label>
      <div class="dialog-actions">${ui.button('Vazgeç', 'close-dialog', 'secondary')}<button type="submit" class="btn primary">Giriş Yap</button></div></form>`));
  }

  const clickActions = {
    navigate: element => navigate(element.dataset.page),
    theme: () => {
      state.theme = state.effectiveTheme === 'dark' ? 'light' : 'dark';
      AtlasCloud.save('atlas:theme', state.theme);
      setTheme();
      render();
      document.querySelector('[data-action="theme"]')?.focus({ preventScroll: true });
    },
    'chart-span': element => {
      state.span = Number(element.dataset.days);
      render();
      root.querySelector('[data-action="chart-span"][data-days="' + state.span + '"]')?.focus({ preventScroll: true });
    },
    'chart-day': element => { document.getElementById('chart-detail').textContent = element.dataset.description; },
    'word-page': element => {
      state.wordPage = Number(element.dataset.index);
      document.getElementById('word-table').innerHTML = ui.wordTable(state);
    },
    'wrong-page': element => { state.wrongPage = Number(element.dataset.index); render(); },
    add: () => openDialog('word', ui.wordDialog()),
    edit: element => {
      const word = state.view.words.get(element.dataset.id);
      if (word && !word.deleted_at) openDialog('word', ui.wordDialog(word, state.data.progress.get(word.id)));
    },
    delete: element => {
      const word = state.view.words.get(element.dataset.id);
      if (!word || word.deleted_at) return;
      openDialog('delete', ui.confirmDialog('Kelimeyi sil', '“' + ui.esc(word.english) + '” havuzdan kaldırılacak. Cevap geçmişi istatistiklerinde kalır.',
        'delete-confirm', 'Kelimeyi Sil', 'data-id="' + ui.esc(word.id) + '"', true));
    },
    'delete-confirm': element => run(async () => {
      await commit([{ kind: 'delete', data: { id: element.dataset.id, updated_at: new Date().toISOString() } }]);
      closeDialog();
      inform('Kelime havuzdan silindi.');
    }, element),
    import: () => { state.paste = ''; state.preview = null; showImport(); },
    'import-source': element => { state.preview = null; showImport(element.dataset.source); },
    'close-dialog': closeDialog,
    'export-csv': () => download(new Blob([core.csvFor(state.data.live)], { type: 'text/csv;charset=utf-8' }), 'csv'),
    'export-xlsx': element => run(async () => download(await AtlasSpreadsheet.toXLSX(state.data.live), 'xlsx'), element),
    backup: () => download(new Blob([JSON.stringify(backupFrom(state.view))], { type: 'application/json' }), 'json', 'kelime-atlasi-yedek'),
    restore: showRestore,
    'restore-confirm': element => run(restoreBackup, element),
    mode: element => startMode(element.dataset.mode),
    answer: element => run(() => answer(Number(element.dataset.index)), element),
    next: element => run(advance, element),
    report: () => { const question = currentQuestion(); if (question) openDialog('report', ui.reportDialog(question)); },
    'end-test': () => openDialog('finish', ui.confirmDialog('Testi bitir', 'Şu ana kadar verdiğin cevaplar kaydedildi.', 'end-confirm', 'Testi Bitir')),
    'end-confirm': element => run(async () => { await commit([], { ...state.active, finished: true }, true); closeDialog(); }, element),
    'clear-test': element => run(() => commit([], null, true), element),
    sync: () => synchronize(true),
    recover: () => {
      const email = document.querySelector('#auth-form [name="email"]')?.value;
      openDialog('recover', ui.dialogFrame('Parolanı sıfırla', 'Adresine bir parola yenileme bağlantısı gönderilir.', `
        <form id="recover-form" class="form-stack"><label class="field-label">E-posta<input class="field" type="email" name="email" value="${ui.esc(email)}" autocomplete="email" required autofocus></label>
        <div class="dialog-actions">${ui.button('Vazgeç', 'close-dialog', 'secondary')}<button type="submit" class="btn primary">Bağlantı Gönder</button></div></form>`));
    },
    reauth: reauthDialog,
    signout: element => run(async () => {
      await state.client.signOut();
      state.recovery = false;
      await activate(state.client);
      inform('Hesabından çıkış yaptın.');
    }, element),
    'copy-local': () => openDialog('copy', ui.confirmDialog('Yerel çalışmayı hesaba ekle',
      'Bu cihazdaki kelimeler ve cevap geçmişi hesabına eklenir. Eşleşen kelimelerin buluttaki karşılıkları korunur.', 'copy-confirm', 'Hesaba Ekle')),
    'copy-confirm': element => run(async () => {
      const view = AtlasStorage.viewFrom(await (await localStore()).read());
      const changes = backupChanges(backupFrom(view));
      await commit(changes);
      closeDialog();
      inform(changes.length ? 'Yerel kayıtlar hesabına eklendi.' : 'Bu kayıtlar zaten hesabında.');
    }, element)
  };

  document.addEventListener('click', event => {
    const element = event.target.closest('button[data-action]');
    if (!element || userWork || element.disabled) return;
    clickActions[element.dataset.action]?.(element);
  });

  const forms = {
    'word-form': saveWord,
    'test-form': startTest,
    'import-form': importWords,
    'report-form': mark,
    'paste-form': async form => {
      state.paste = new FormData(form).get('pairs');
      displayPreview(core.mapImport(core.parsePaste(state.paste), true), 'Yapıştırılan metin');
    },
    'config-form': async form => {
      const values = new FormData(form);
      const config = AtlasCloud.validateConfig({ url: values.get('url'), key: values.get('key') });
      AtlasCloud.configToStore(config);
      state.config = config;
      state.client = new AtlasCloud.Client(config);
      await activate(state.client);
      inform('Supabase bağlantısı kaydedildi.');
    },
    'auth-form': async (form, submitter) => {
      const values = new FormData(form);
      const email = values.get('email').trim();
      const password = values.get('password');
      const signup = submitter?.value === 'signup';
      if (signup && password.length < 8) throw new Error('Hesap açmak için en az 8 karakterli bir parola seç.');
      const session = signup ? await state.client.signUp(email, password) : await state.client.signIn(email, password);
      if (!session) {
        form.elements.password.value = '';
        inform('Doğrulama bağlantısı e-postana gönderildi.');
        return;
      }
      await activate(state.client);
      inform('Bulut hesabın açıldı.');
    },
    'reauth-form': async form => {
      const fields = new FormData(form);
      await state.client.signIn(fields.get('email'), fields.get('password'));
      await activate(state.client);
      closeDialog();
      inform('Yeniden giriş yaptın.');
    },
    'recover-form': async form => {
      await state.client.recover(new FormData(form).get('email').trim());
      closeDialog();
      inform('Adres kayıtlıysa parola yenileme bağlantısı gönderildi.');
    },
    'password-form': async form => {
      await state.client.password(new FormData(form).get('password'));
      state.recovery = false;
      render();
      inform('Parola güncellendi.');
    }
  };

  document.addEventListener('submit', event => {
    const form = event.target;
    const handler = forms[form.id];
    if (!handler) return;
    event.preventDefault();
    run(() => handler(form, event.submitter), event.submitter);
  });

  document.addEventListener('input', event => {
    if (event.target.id === 'word-search') {
      state.query = event.target.value;
      state.wordPage = 1;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        const table = document.getElementById('word-table');
        if (table) table.innerHTML = ui.wordTable(state);
      }, 85);
    }
    if (event.target.id === 'custom-count') state.custom = event.target.value;
    if (event.target.name === 'pairs') {
      state.paste = event.target.value;
      if (state.preview) {
        state.preview = null;
        document.getElementById('import-preview').innerHTML = '';
      }
    }
  });

  document.addEventListener('change', event => {
    const target = event.target;
    if (target.id === 'theme-select') {
      state.theme = target.value;
      AtlasCloud.save('atlas:theme', state.theme);
      setTheme();
      render();
      document.getElementById('theme-select')?.focus({ preventScroll: true });
    } else if (target.id === 'word-sort') {
      state.wordSort = target.value;
      state.wordPage = 1;
      document.getElementById('word-table').innerHTML = ui.wordTable(state);
    } else if (target.name === 'mode' && target.closest('#test-form')) {
      state.mode = target.value;
      document.getElementById('test-availability').textContent = ui.availability(state);
    } else if (target.name === 'count') {
      state.count = target.value;
      const input = document.getElementById('custom-count');
      input.hidden = input.disabled = state.count !== 'custom';
      input.required = state.count === 'custom';
      if (!input.hidden) input.focus();
    } else if (target.id === 'file-import' && target.files[0]) {
      const file = target.files[0];
      run(async () => {
        state.preview = null;
        const preview = document.getElementById('import-preview');
        preview.innerHTML = '<p class="subtext" role="status">Dosya okunuyor…</p>';
        try {
          displayPreview(core.mapImport(await AtlasSpreadsheet.readFile(file)), file.name);
        } catch (error) {
          preview.innerHTML = '';
          throw error;
        } finally {
          target.value = '';
        }
      }, target);
    } else if (target.id === 'restore-file' && target.files[0]) {
      const file = target.files[0];
      run(async () => {
        const summary = document.getElementById('restore-summary');
        summary.textContent = '';
        state.restore = null;
        try {
          if (file.size > 80 * 1024 * 1024) throw new Error('Yedek dosyası 80 MB sınırını aşıyor.');
          let data;
          try { data = JSON.parse(await file.text()); }
          catch { throw new Error('Yedek dosyası okunamadı. Geçerli bir JSON dosyası seç.'); }
          const changes = backupChanges(data);
          state.restore = data;
          summary.innerHTML = '<p class="subtext">' + ui.amount(changes.length) + ' yeni kayıt içe aktarılabilir.</p><div class="dialog-actions">' +
            ui.button('Yedeği İçe Aktar', 'restore-confirm') + '</div>';
        } finally {
          target.value = '';
        }
      }, target);
    }
  });

  modal.addEventListener('cancel', event => {
    event.preventDefault();
    if (!userWork) closeDialog();
  });

  systemTheme.addEventListener?.('change', () => {
    if (state.theme !== 'system') return;
    setTheme();
    render();
  });
  channel?.addEventListener('message', event => {
    if (state.profile === event.data && state.store) refresh().then(changed => { if (changed) syncRender(); }).catch(() => {});
  });
  window.addEventListener('online', () => queueSync(0));
  window.addEventListener('focus', () => queueSync(0));
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      queueSync(0);
      if (state.store) refresh().then(changed => { if (changed) syncRender(); }).catch(() => {});
    }
  });
  setInterval(() => {
    if (document.visibilityState === 'visible') queueSync(0);
  }, 15_000);

  async function boot() {
    setTheme();
    const fragment = new URLSearchParams(location.hash.slice(1));
    const fromEmail = fragment.has('access_token') || fragment.has('error_description');
    if (fromEmail) {
      try { history.replaceState(null, '', location.pathname + location.search); } catch { /* Local file URLs may forbid history changes. */ }
    }
    let authMessage = '';
    let authError = false;
    try {
      state.config = await AtlasCloud.loadConfig();
      if (state.config) state.client = new AtlasCloud.Client(state.config);
      if (fromEmail) {
        state.page = 'settings';
        if (!state.client || fragment.has('error_description')) throw new Error('E-posta bağlantısı doğrulanamadı. Supabase bağlantı ayarlarını kontrol et ve yeni bağlantı iste.');
        await state.client.fromEmail(fragment);
        state.recovery = fragment.get('type') === 'recovery';
        if (!state.recovery) authMessage = 'E-posta adresin doğrulandı.';
      }
    } catch (error) {
      authMessage = error.message;
      authError = true;
    }
    await activate(state.client);
    if (authMessage) inform(authMessage, authError);
    if (document.querySelector('link[rel="manifest"]') && navigator.serviceWorker && ['https:', 'http:'].includes(location.protocol)) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  }

  boot().catch(error => {
    root.innerHTML = '<div class="boot" role="alert">Uygulama açılırken bir hata oluştu. ' + ui.esc(error.message) + '</div>';
  });
})();</script>
</body>
