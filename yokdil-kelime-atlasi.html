<title>Kelime Atlası · YÖKDİL Sosyal Bilimler</title>
<style>:root {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-synthesis: none;
  color-scheme: light;
  --bg: #f7f7fb;
  --panel: #ffffff;
  --panel-2: #f8f8fc;
  --sidebar: #fdfdff;
  --text: #232235;
  --muted: #656479;
  --quiet: #76748b;
  --line: #e6e4ee;
  --soft: #f2effa;
  --brand: #5b42bc;
  --brand-strong: #5137b4;
  --on-brand: #fff;
  --brand-faint: #eae4fb;
  --hero: #ede8fd;
  --hero-ink: #2c1e56;
  --hero-muted: #54466d;
  --green: #22634e;
  --green-bg: #e3f4eb;
  --orange: #875321;
  --orange-bg: #f9ecdb;
  --red: #a6384e;
  --red-bg: #fbe7ec;
  --blue: #3d538f;
  --blue-bg: #e9eeff;
  --shadow: 0 2px 5px #25203f06, 0 12px 28px #25203f04;
  --ring: 0 0 0 3px #987df683;
  --sidebar-width: 240px;
  --top-height: 69px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #151420;
  --panel: #201f2d;
  --panel-2: #262435;
  --sidebar: #1b1a27;
  --text: #f3effa;
  --muted: #bdb7cd;
  --quiet: #a9a3bc;
  --line: #383448;
  --soft: #2e2844;
  --brand: #b9a6ff;
  --brand-strong: #c4b3ff;
  --on-brand: #20143d;
  --brand-faint: #372d54;
  --hero: #302649;
  --hero-ink: #f4edff;
  --hero-muted: #d0c4e6;
  --green: #91dfbd;
  --green-bg: #223e38;
  --orange: #ffcd95;
  --orange-bg: #463225;
  --red: #ffacba;
  --red-bg: #472834;
  --blue: #b4c3ff;
  --blue-bg: #2d3658;
  --shadow: 0 2px 5px #08061633;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; min-width: 300px; color: var(--text); background: var(--bg); }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .55; }
a { color: inherit; }
:focus-visible { outline: none; box-shadow: var(--ring); }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { letter-spacing: -.037em; }
p { line-height: 1.55; }
.icon { width: 20px; height: 20px; stroke-width: 1.75; flex: none; }
.boot { min-height: 80vh; display: grid; place-items: center; color: var(--muted); }
.skip-link { position: fixed; top: 7px; left: 7px; transform: translateY(-200%); z-index: 20; background: var(--panel); padding: 10px; }
.skip-link:focus { transform: none; }
.shell { min-height: 100dvh; display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); }
.sidebar { position: sticky; top: 0; height: 100dvh; background: var(--sidebar); border-right: 1px solid var(--line); padding: 24px 18px 20px; display: flex; flex-direction: column; z-index: 3; }
.brand { border: 0; background: none; color: var(--text); display: flex; align-items: center; gap: 11px; padding: 0 2px; text-align: left; white-space: nowrap; border-radius: 12px; }
.brand-icon { height: 39px; width: 39px; border-radius: 13px; background: #694dd3; color: white; display: grid; place-items: center; flex: none; box-shadow: 0 3px 8px #674cd733; }
.brand-icon .icon { width: 23px; height: 23px; }
.brand strong { display: block; font-size: 17px; letter-spacing: -.055em; }
.brand small { display: block; margin-top: 4px; font-size: 10.5px; font-weight: 600; color: var(--quiet); }
.nav { display: grid; gap: 5px; margin-top: 38px; }
.nav-link { display: flex; gap: 12px; align-items: center; min-height: 45px; width: 100%; border: 0; color: var(--muted); background: transparent; text-decoration: none; padding: 9px 12px; border-radius: 10px; font-size: 13px; font-weight: 570; text-align: left; white-space: nowrap; }
.nav-link:hover { background: var(--panel-2); color: var(--text); }
.nav-link[aria-current="page"] { background: var(--brand-faint); color: var(--brand-strong); font-weight: 720; }
.nav-label { flex: 1; }
.nav-count { font-size: 10px; font-weight: 750; color: var(--brand); background: var(--brand-faint); padding: 3px 6px; border-radius: 5px; }
.nav-link[aria-current="page"] .nav-count { background: var(--panel); }
.side-bottom { margin-top: auto; display: grid; gap: 12px; }
.side-bottom .nav-link { border-top: 1px solid var(--line); border-radius: 0 0 10px 10px; padding-top: 14px; }
.profile { background: var(--panel-2); display: flex; align-items: center; gap: 9px; border: 1px solid var(--line); padding: 9px; min-width: 0; border-radius: 12px; text-align: left; color: var(--text); }
.profile .avatar { display: grid; place-items: center; width: 31px; height: 31px; border-radius: 10px; background: var(--brand-faint); color: var(--brand); font-weight: 750; flex: none; }
.profile strong, .profile small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.profile strong { font-size: 11.5px; }
.profile small { margin-top: 4px; font-size: 10px; color: var(--quiet); }
.profile .identity { min-width: 0; flex: 1; }
.profile > .icon { width: 14px; height: 14px; color: var(--quiet); }
.top { height: var(--top-height); display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 36px; background: var(--sidebar); border-bottom: 1px solid var(--line); }
.top-title { font-size: 13px; font-weight: 670; letter-spacing: -.01em; white-space: nowrap; }
.top-tools { display: flex; align-items: center; gap: 11px; }
.top-brand { display: none; }
.sync-chip { display: flex; gap: 7px; align-items: center; min-height: 34px; border-radius: 20px; padding: 6px 10px; color: var(--muted); background: var(--panel-2); border: 1px solid var(--line); font-size: 11px; font-weight: 600; white-space: nowrap; }
.sync-chip .icon { width: 15px; height: 15px; color: var(--brand); }
.sync-chip[data-state="ok"] .icon { color: var(--green); }
.sync-chip[data-state="error"] .icon { color: var(--orange); }
.icon-btn { display: inline-grid; place-items: center; width: 37px; height: 37px; flex: none; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); background: var(--panel); }
.icon-btn:hover, .sync-chip:hover { border-color: var(--brand); color: var(--brand); }
.icon-btn .icon { width: 18px; height: 18px; }
main { width: min(100%, 1270px); margin-inline: auto; padding: 32px 36px 47px; }
main:focus { outline: none; }
.mobile-nav { display: none; }
.hero { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(255px, 1fr); min-height: 259px; border: 1px solid var(--brand-faint); border-radius: 21px; position: relative; isolation: isolate; overflow: hidden; background: var(--hero); box-shadow: var(--shadow); }
.hero-copy { padding: 31px 0 31px 33px; z-index: 2; }
.context { display: flex; align-items: center; gap: 7px; color: var(--brand-strong); font-size: 11px; letter-spacing: .035em; font-weight: 770; }
.context .icon { width: 15px; height: 15px; }
.hero h1 { font-size: clamp(34px, 3.85vw, 55px); font-weight: 730; line-height: 1.03; letter-spacing: -.066em; margin: 13px 0 11px; color: var(--hero-ink); }
.hero p { font-size: 14px; color: var(--hero-muted); max-width: 395px; }
.hero-actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
.art { position: relative; align-self: stretch; min-height: 210px; color: #7e62cf; z-index: -1; pointer-events: none; }
.art-ring { position: absolute; top: 50%; left: 56%; width: 310px; height: 310px; border-radius: 50%; border: 1px solid #8d72d330; transform: translate(-50%, -50%); }
.art-ring::after, .art-ring::before { content: ""; position: absolute; inset: 22px; border: 1px solid #8d72d330; border-radius: 50%; }
.art-ring::after { inset: 48px; background: #a990ed24; }
.flash { position: absolute; left: 52%; top: 50%; width: 123px; height: 154px; display: grid; justify-items: center; align-content: center; gap: 8px; border-radius: 19px; font-weight: 720; border: 1px solid #fff9; box-shadow: 0 16px 30px #52338d30; }
.flash.back { background: #b6a0f1; color: #392773; transform: translate(-23%, -48%) rotate(16deg); }
.flash.front { background: #fdfbff; color: #5a3cb5; transform: translate(-86%, -55%) rotate(-12deg); }
.flash .letters { font-size: 44px; letter-spacing: -.095em; line-height: 1; }
.flash .art-text { font-size: 10px; letter-spacing: .13em; }
.art-spark { position: absolute; left: 24%; top: 26%; color: #8b70d3; }
.art-spark.two { left: 82%; top: 62%; transform: scale(.75); }
.art-dot { position: absolute; top: 22%; left: 79%; width: 6px; height: 6px; border-radius: 100%; background: #997ad8; }
.btn { min-height: 42px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; border: 1px solid transparent; padding: 9px 14px; font-size: 13px; font-weight: 690; text-decoration: none; line-height: 1.25; white-space: nowrap; }
.btn .icon { width: 17px; height: 17px; }
.primary { background: var(--brand); color: var(--on-brand); }
.primary:hover { background: var(--brand-strong); }
.secondary { background: var(--panel); color: var(--text); border-color: var(--line); }
.secondary:hover { border-color: var(--brand); color: var(--brand); }
.hero .secondary { background: #ffffff88; border-color: #aa94dc4d; color: #432e82; }
:root[data-theme="dark"] .hero .secondary { background: #ffffff11; color: var(--hero-ink); }
.ghost { background: transparent; color: var(--brand); }
.ghost:hover { background: var(--soft); }
.danger { background: var(--red-bg); color: var(--red); border-color: transparent; }
.danger:hover { border-color: var(--red); }
.sm { min-height: 35px; padding: 7px 10px; font-size: 12px; }
.section-title { margin: 25px 0 13px; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.section-title h2, .panel h2 { font-size: 19px; font-weight: 720; }
.overview-date { display: flex; align-items: center; gap: 6px; color: var(--quiet); font-size: 11.5px; font-weight: 600; }
.overview-date .icon { width: 15px; height: 15px; }
.metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.metric { border-radius: 15px; background: var(--panel); border: 1px solid var(--line); padding: 15px 16px 14px; box-shadow: var(--shadow); min-width: 0; }
.metric-label { display: flex; gap: 9px; align-items: center; color: var(--muted); font-size: 12px; font-weight: 630; }
.tile-icon { border-radius: 9px; width: 32px; height: 32px; display: grid; place-items: center; flex: none; color: var(--brand); background: var(--brand-faint); }
.tile-icon .icon { width: 17px; height: 17px; }
.tile-icon.green { color: var(--green); background: var(--green-bg); }
.tile-icon.orange { color: var(--orange); background: var(--orange-bg); }
.tile-icon.blue { color: var(--blue); background: var(--blue-bg); }
.tile-icon.red { color: var(--red); background: var(--red-bg); }
.metric strong { display: block; margin: 11px 0 5px; font-size: 30px; letter-spacing: -.067em; line-height: 1; font-weight: 730; }
.metric small { display: block; font-size: 10.5px; color: var(--quiet); line-height: 1.35; }
.dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.85fr) minmax(250px, 1fr); gap: 15px; margin-top: 17px; }
.panel { border: 1px solid var(--line); background: var(--panel); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.panel-head p, .subtext { color: var(--muted); font-size: 12px; margin-top: 5px; }
.segmented { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; white-space: nowrap; flex: none; }
.segmented button { min-height: 29px; color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 4px 9px; font-size: 11px; font-weight: 650; }
.segmented button[aria-pressed="true"] { background: var(--panel); color: var(--brand); border-color: var(--line); box-shadow: var(--shadow); }
.chart { position: relative; height: 157px; margin-top: 17px; padding-left: 27px; }
.chart-axis { position: absolute; inset: 0 0 30px 0; display: flex; flex-direction: column; justify-content: space-between; font-size: 9px; color: var(--quiet); pointer-events: none; }
.chart-tick { display: flex; align-items: center; gap: 5px; }
.chart-tick span { width: 21px; text-align: right; }
.chart-tick i { border-top: 1px dashed var(--line); flex: 1; }
.chart-bars { position: relative; height: 100%; display: grid; grid-template-columns: repeat(var(--count), minmax(0, 1fr)); gap: clamp(2px, 1vw, 12px); padding-bottom: 8px; }
.bar { border: none; background: none; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; color: var(--quiet); padding: 0; border-radius: 4px; }
.bar-fill { width: min(61%, 32px); height: max(2px, var(--height)); border-radius: 4px 4px 0 0; background: var(--brand-faint); display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
.bar-fill.has-data { background: var(--red-bg); }
.bar-fill i { height: var(--correct); background: var(--brand); width: 100%; }
.bar:hover .bar-fill, .bar:focus-visible .bar-fill { outline: 1px solid var(--brand); }
.bar small { display: grid; place-items: center; height: 22px; font-size: 9px; white-space: nowrap; flex: none; }
.chart[data-period="30"] .chart-bars { gap: 3px; }
.chart[data-period="30"] .bar small { position: relative; z-index: 1; font-size: 8px; }
.chart-legend { display: flex; gap: 11px; color: var(--quiet); font-size: 10px; margin: 6px 0 0 27px; }
.chart-legend span { display: flex; align-items: center; gap: 5px; }
.chart-legend i { width: 8px; height: 8px; border-radius: 2px; background: var(--brand); }
.chart-legend span + span i { background: var(--red-bg); border: 1px solid var(--red); }
.chart-tooltip { min-height: 19px; margin: 3px 0 0 27px; color: var(--muted); font-size: 10.5px; }
.plan-ring { width: 53px; height: 53px; flex: none; display: grid; place-items: center; border-radius: 50%; background: conic-gradient(var(--brand) var(--fill), var(--brand-faint) 0); }
.plan-ring span { width: 43px; height: 43px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; color: var(--brand); font-size: 12px; font-weight: 760; }
.plan-summary { display: flex; gap: 12px; align-items: center; margin: 19px 0 13px; }
.plan-summary strong { font-size: 14px; letter-spacing: -.02em; }
.plan-summary p { font-size: 11px; color: var(--quiet); margin-top: 3px; }
.plan-link { min-height: 44px; display: flex; align-items: center; width: 100%; gap: 9px; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; color: var(--text); font-size: 12px; font-weight: 620; padding: 8px 2px; border-radius: 0; }
.plan-link:hover { color: var(--brand); }
.plan-link .icon { width: 16px; height: 16px; color: var(--brand); }
.plan-link span { flex: 1; }
.plan-link b { font-size: 11px; color: var(--quiet); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 1px 0 23px; }
.page-head h1 { font-size: clamp(29px, 4vw, 41px); line-height: 1.1; font-weight: 730; letter-spacing: -.06em; }
.page-head p { margin-top: 6px; font-size: 13px; color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.pool-tools { display: flex; gap: 9px; align-items: center; margin-bottom: 16px; }
.search-field { display: flex; gap: 9px; align-items: center; background: var(--panel-2); border-radius: 9px; border: 1px solid var(--line); padding: 0 10px; color: var(--quiet); flex: 1; min-width: 0; }
.search-field .icon { width: 17px; height: 17px; }
.search-field:focus-within { border-color: var(--brand); }
.search-field input { width: 100%; min-height: 42px; border: 0; background: transparent; color: var(--text); outline: none; box-shadow: none; }
.field, .pool-tools select { width: 100%; min-height: 44px; color: var(--text); border: 1px solid var(--line); border-radius: 9px; background: var(--panel-2); padding: 9px 11px; }
.pool-tools select { width: auto; }
.field::placeholder, .search-field input::placeholder { color: var(--quiet); }
textarea.field { resize: vertical; }
label.field-label { display: grid; gap: 6px; font-size: 12px; font-weight: 690; }
.pool-table { width: 100%; border-collapse: collapse; table-layout: fixed; text-align: left; font-size: 12px; }
.pool-table th { color: var(--quiet); font-size: 10.5px; text-transform: uppercase; letter-spacing: .045em; font-weight: 720; }
.pool-table th, .pool-table td { padding: 10px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; overflow-wrap: anywhere; }
.pool-table th:first-child, .pool-table td:first-child { padding-left: 0; }
.pool-table th:last-child, .pool-table td:last-child { padding-right: 0; }
.pool-table td strong { display: block; font-size: 13px; }
.pool-table td small { display: block; margin-top: 5px; font-size: 10.5px; color: var(--quiet); }
.pool-table .translation { white-space: pre-line; }
.pool-table .row-actions { text-align: right; white-space: nowrap; }
.pool-table .icon-btn { width: 33px; height: 33px; margin-left: 3px; }
.state-pill { display: inline-block; font-size: 10px; font-weight: 680; padding: 4px 7px; border-radius: 6px; background: var(--panel-2); color: var(--muted); }
.state-pill.learned { background: var(--green-bg); color: var(--green); }
.state-pill.learning { background: var(--brand-faint); color: var(--brand); }
.pagination { display: flex; align-items: center; justify-content: space-between; gap: 7px; margin-top: 13px; font-size: 11px; color: var(--quiet); }
.empty { text-align: center; padding: 33px 12px; }
.empty .tile-icon { margin: 0 auto 10px; }
.empty h3 { font-size: 17px; margin-bottom: 5px; }
.empty p { margin-bottom: 13px; font-size: 12px; color: var(--muted); }
.test-layout { max-width: 770px; margin-inline: auto; }
.form-stack { display: grid; gap: 14px; }
.test-setup { display: grid; gap: 20px; }
.mode-options { display: grid; gap: 7px; margin-top: 11px; }
.mode-choice { display: flex; align-items: center; gap: 11px; border-radius: 10px; border: 1px solid var(--line); padding: 9px; background: var(--panel-2); cursor: pointer; min-height: 53px; }
.mode-choice:has(:checked) { border-color: var(--brand); background: var(--soft); }
.mode-choice strong, .mode-choice small { display: block; }
.mode-choice strong { font-size: 13px; }
.mode-choice small { margin-top: 4px; font-size: 11px; color: var(--quiet); }
input[type="radio"], input[type="checkbox"] { accent-color: var(--brand); flex: none; }
.mode-choice input { margin-left: auto; width: 17px; height: 17px; }
.counts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
.count-pill { display: grid; place-items: center; cursor: pointer; min-width: 51px; min-height: 40px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); background: var(--panel-2); padding: 7px 11px; font-size: 13px; font-weight: 660; }
.count-pill:has(:checked) { border-color: var(--brand); background: var(--soft); color: var(--brand); }
.count-pill:focus-within { box-shadow: var(--ring); }
.custom-count { max-width: 160px; margin-top: 9px; }
.test-info { color: var(--quiet); font-size: 12px; margin-top: 8px; }
.test-progress { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 9px; font-size: 12px; font-weight: 660; color: var(--muted); }
.progress-track { height: 8px; background: var(--line); border-radius: 9px; overflow: hidden; margin-bottom: 20px; }
.progress-track span { display: block; height: 100%; background: var(--brand); border-radius: 9px; }
.question-card { padding: clamp(17px, 4vw, 31px); }
.question-card h1 { font-size: clamp(29px, 6vw, 53px); overflow-wrap: anywhere; margin: 8px 0 5px; line-height: 1.02; }
.question-card h1:focus { outline: none; box-shadow: none; }
.question-card .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 20px 0; }
.choice { text-align: left; min-height: 60px; display: flex; align-items: center; gap: 11px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); border-radius: 11px; padding: 10px; font-size: 14px; line-height: 1.35; }
.choice:hover:not(:disabled) { border-color: var(--brand); }
.choice:disabled { opacity: 1; }
.choice b { display: grid; place-items: center; width: 29px; height: 29px; border-radius: 8px; border: 1px solid var(--line); font-size: 11px; background: var(--panel); color: var(--muted); flex: none; }
.choice span { overflow-wrap: anywhere; }
.choice.good { background: var(--green-bg); color: var(--green); border-color: var(--green); }
.choice.bad { background: var(--red-bg); color: var(--red); border-color: var(--red); }
.feedback { display: flex; align-items: flex-start; gap: 8px; border-radius: 9px; padding: 11px; margin-bottom: 12px; font-size: 13px; line-height: 1.4; overflow-wrap: anywhere; }
.feedback.good { background: var(--green-bg); color: var(--green); }
.feedback.bad { background: var(--red-bg); color: var(--red); }
.feedback.reported { background: var(--soft); color: var(--brand); }
.question-actions { display: flex; gap: 8px; justify-content: space-between; align-items: center; }
.result .metric { background: var(--panel-2); box-shadow: none; }
.result .actions { margin-top: 16px; }
.wrong-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.wrong-row strong { display: block; font-size: 14px; }
.wrong-row p { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.wrong-row .wrong-detail { margin-left: auto; text-align: right; font-size: 11px; color: var(--quiet); }
.stat-list { display: grid; gap: 8px; margin-top: 12px; }
.stat-list > div { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 33px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.stat-list strong { color: var(--text); }
.settings-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(260px, 1fr); gap: 14px; align-items: start; }
.settings-column { display: grid; gap: 14px; }
.settings-grid .form-stack { margin-top: 13px; }
.settings-grid .field-label { overflow-wrap: anywhere; }
.setting-item { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 9px; padding-top: 13px; }
.setting-item label { font-size: 13px; }
.setting-item select { width: auto; }
.account-email { margin: 8px 0; font-size: 14px; font-weight: 700; overflow-wrap: anywhere; }
.details { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 11px; color: var(--muted); }
.details summary { font-size: 12px; cursor: pointer; }
.notice { color: var(--orange); background: var(--orange-bg); padding: 10px 12px; border-radius: 9px; font-size: 12px; margin-bottom: 12px; }
dialog { border: 1px solid var(--line); color: var(--text); background: var(--panel); border-radius: 16px; box-shadow: 0 16px 70px #16102c45; width: min(570px, calc(100% - 27px)); max-height: calc(100dvh - 28px); padding: 0; }
dialog::backdrop { background: #1b142d66; }
.dialog-inner { padding: 20px; }
.dialog-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; margin-bottom: 13px; }
.dialog-head h2 { font-size: 21px; margin-top: 3px; }
.dialog-head p { color: var(--muted); font-size: 12px; margin-top: 4px; }
.dialog-actions { margin-top: 14px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.dialog-inner .segmented { margin-bottom: 13px; }
.preview-table { max-height: 240px; overflow: auto; margin: 11px 0; border: 1px solid var(--line); border-radius: 9px; padding: 4px 8px; }
.preview-table .pool-table th { position: sticky; top: 0; background: var(--panel); }
.import-file { min-height: 104px; border: 1px dashed var(--brand); border-radius: 10px; display: grid; place-items: center; align-content: center; gap: 6px; cursor: pointer; background: var(--soft); color: var(--brand); font-size: 13px; font-weight: 710; padding: 14px; text-align: center; }
.import-file small { color: var(--muted); font-size: 10.5px; font-weight: 500; }
.import-file:focus-within { box-shadow: var(--ring); }
.form-error { color: var(--red); font-size: 12px; margin: 8px 0; }
.report-option { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; padding: 7px 0; }
.toast { position: fixed; z-index: 10; inset: auto 17px 17px auto; max-width: min(410px, calc(100% - 34px)); border: 1px solid var(--line); background: var(--text); color: var(--panel); box-shadow: var(--shadow); border-radius: 11px; padding: 12px 15px; font-size: 13px; font-weight: 590; }
.toast.error { color: var(--red); background: var(--red-bg); border-color: var(--red); }
dialog .toast { position: static; }
.sr-only { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0,0,0,0) !important; white-space: nowrap !important; border: 0 !important; }
@media (max-width: 1110px) {
  :root { --sidebar-width: 207px; }
  main { padding-inline: 24px; }
  .top { padding-inline: 24px; }
  .sidebar { padding-inline: 14px; }
  .metric { padding-inline: 12px; }
  .metric-label { gap: 6px; }
}
@media (max-width: 850px) {
  :root { --sidebar-width: 62px; }
  .sidebar { padding: 16px 8px; }
  .brand { justify-content: center; width: 100%; }
  .brand-copy, .sidebar .nav-label, .nav-count, .profile .identity, .profile > .icon { display: none; }
  .nav { margin-top: 28px; }
  .nav-link { justify-content: center; padding-inline: 5px; }
  .profile { justify-content: center; padding: 5px; }
  .metrics { gap: 9px; }
  .dashboard-grid { gap: 10px; }
  .panel { padding: 16px; }
}
@media (max-width: 650px) {
  :root { --top-height: 58px; }
  .shell { display: block; }
  .sidebar, .top-title { display: none; }
  .top { padding: 0 13px; }
  .top-brand { display: block; }
  .top-brand .brand { justify-content: flex-start; }
  .top-brand .brand-copy { display: block; }
  .top-brand .brand-icon { width: 33px; height: 33px; border-radius: 9px; }
  .top-brand .brand-icon .icon { width: 19px; height: 19px; }
  .top-brand .brand strong { font-size: 14px; }
  .top-brand .brand small { font-size: 9px; margin-top: 3px; }
  .top-tools { gap: 6px; }
  .sync-chip { min-height: 37px; padding-inline: 7px; font-size: 10px; }
  .icon-btn { width: 38px; height: 38px; }
  main { padding: 15px 12px calc(83px + env(safe-area-inset-bottom)); }
  .mobile-nav { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; padding: 5px 3px calc(5px + env(safe-area-inset-bottom)); background: var(--sidebar); border-top: 1px solid var(--line); z-index: 4; }
  .mobile-nav .nav-link { flex-direction: column; gap: 4px; min-height: 48px; padding: 4px 1px; font-size: 9px; }
  .mobile-nav .nav-label { flex: initial; }
  .mobile-nav .icon { width: 18px; height: 18px; }
  .hero { grid-template-columns: minmax(0, 1fr); min-height: 0; border-radius: 16px; }
  .hero-copy { padding: 22px 16px; }
  .hero h1 { font-size: clamp(31px, 8.8vw, 45px); max-width: 88%; margin: 11px 0 9px; }
  .hero p { font-size: 12px; max-width: 77%; }
  .hero-actions { gap: 6px; margin-top: 15px; }
  .hero-actions .btn { min-height: 43px; padding-inline: 9px; font-size: 11.5px; }
  .art { position: absolute; inset: 3px -102px auto auto; width: 235px; height: 159px; transform: scale(.49); transform-origin: 19% 42%; opacity: .7; }
  .art-ring { width: 250px; height: 250px; }
  .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .metric { padding: 11px; }
  .metric strong { font-size: 27px; }
  .metric-label { font-size: 11px; }
  .tile-icon { width: 28px; height: 28px; }
  .section-title { margin-top: 19px; }
  .dashboard-grid, .settings-grid { grid-template-columns: minmax(0, 1fr); }
  .page-head { flex-wrap: wrap; margin: 1px 0 14px; }
  .page-head h1 { font-size: 30px; }
  .page-head p { font-size: 12px; }
  .pool-tools { align-items: stretch; }
  .pool-tools select { width: 105px; font-size: 11px; padding-inline: 5px; }
  .pool-table .wide-cell { display: none; }
  .pool-table col.wide-cell { display: table-column; width: 0 !important; visibility: collapse; }
  .pool-table .row-actions { white-space: normal; }
  .pool-table .icon-btn { margin: 2px 0 2px 3px; width: 38px; height: 42px; }
  .question-card .choices { grid-template-columns: minmax(0, 1fr); margin: 15px 0; gap: 8px; }
  .choice { min-height: 54px; }
  .question-actions .btn { font-size: 11.5px; padding-inline: 6px; }
  .question-actions .btn, .count-pill { min-height: 44px; }
  .field, .search-field input { font-size: 16px; }
  .pool-tools select { font-size: 12px; }
  .toast { bottom: calc(65px + env(safe-area-inset-bottom)); }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .nav-link, .choice { transition: background-color .15s ease, border-color .15s ease; }
}</style>

          checkTest(active, testChange);
          if (testChange) tx.objectStore('meta').put({ id: 'active', value: testChange.next });
          if (cloud) {
            for (const op of operations) tx.objectStore('outbox').add(op);
            return;
          }
          if (wordChanges) for (const word of mutationRows(words, operations)) tx.objectStore('words').put(word);
          for (const { kind, data } of operations) {
            if (kind === 'answer' || kind === 'report') tx.objectStore(kind + 's').put(data);
          }
        });
        if (wordChanges) {
          const request = tx.objectStore('words').getAll();
          request.onsuccess = () => { words = request.result; if (--waiting === 0) apply(); };
        }
        if (testChange) {
          const request = tx.objectStore('meta').get('active');
          request.onsuccess = () => { active = request.result?.value; if (--waiting === 0) apply(); };
        }
        if (!waiting) apply();
      });
    }

    remote(page) {
      if (!page.length) return Promise.resolve();
      return this.transaction([...COLLECTIONS, 'meta'], 'readwrite', (tx, finish, guard) => {
        const metadata = tx.objectStore('meta');
        const read = metadata.get('cursor');
        read.onsuccess = guard(() => {
          const cursor = read.result?.value ?? 0;
          for (const change of page) {
            if (change.data.revision > cursor) tx.objectStore(change.kind).put(change.data);
          }
          const latest = page.at(-1).data.revision;
          if (latest > cursor) metadata.put({ id: 'cursor', value: latest });
        });
      });
    }

    acknowledge(orders) {
      return this.transaction(['outbox'], 'readwrite', tx => {
        for (const order of orders) tx.objectStore('outbox').delete(order);
      });
    }
  }

  class TextStore {
    constructor(key, durable) {
      this.key = key;
      this.kind = durable ? 'text' : 'memory';
      this.memory = null;
    }

    readRaw() {
      const data = this.kind === 'text' ? localStorage.getItem(this.key) : this.memory;
      return data ? JSON.parse(data) : { words: [], answers: [], reports: [], outbox: [], meta: [], sequence: 0 };
    }

    update(apply) {
      const data = this.readRaw();
      apply(data);
      const packed = JSON.stringify(data);
      if (this.kind === 'text') localStorage.setItem(this.key, packed);
      else this.memory = packed;
    }

    async read() {
      return snapshot(this.readRaw());
    }

    async pending() {
      const data = this.readRaw();
      return { outbox: data.outbox, cursor: data.meta.find(row => row.id === 'cursor')?.value ?? 0 };
    }

    async seed(words) {
      this.update(data => {
        if (data.meta.some(row => row.id === 'seeded')) return;
        data.words.push(...words);
        data.meta.push({ id: 'seeded', value: true });
      });
    }

    async write(operations, cloud, testChange) {
      this.update(data => {
        const active = data.meta.find(row => row.id === 'active');
        checkTest(active?.value, testChange);
        if (testChange) {
          data.meta = data.meta.filter(row => row.id !== 'active');
          data.meta.push({ id: 'active', value: testChange.next });
        }
        if (cloud) {
          for (const op of operations) data.outbox.push({ ...op, order: ++data.sequence });
          return;
        }
        const changed = mutationRows(data.words, operations);
        for (const [name, rows] of [
          ['words', changed], ['answers', operations.filter(op => op.kind === 'answer').map(op => op.data)],
          ['reports', operations.filter(op => op.kind === 'report').map(op => op.data)]
        ]) {
          if (!rows.length) continue;
          const map = new Map(data[name].map(row => [row.id, row]));
          for (const row of rows) map.set(row.id, row);
          data[name] = [...map.values()];
        }
      });
    }

    async remote(page) {
      if (!page.length) return;
      this.update(data => {
        const cursor = data.meta.find(row => row.id === 'cursor')?.value ?? 0;
        for (const name of COLLECTIONS) {
          const rows = page.filter(change => change.kind === name && change.data.revision > cursor);
          if (!rows.length) continue;
          const map = new Map(data[name].map(row => [row.id, row]));
          for (const row of rows) map.set(row.data.id, row.data);
          data[name] = [...map.values()];
        }
        if (page.at(-1).data.revision > cursor) {
          data.meta = data.meta.filter(row => row.id !== 'cursor');
          data.meta.push({ id: 'cursor', value: page.at(-1).data.revision });
        }
      });
    }

    async acknowledge(orders) {
      const saved = new Set(orders);
      this.update(data => { data.outbox = data.outbox.filter(op => !saved.has(op.order)); });
    }
  }

  function openIDB(name) {
    return new Promise((resolve, reject) => {
      let request;
      try {
        request = indexedDB.open(name, 1);
      } catch (error) {
        reject(error);
        return;
      }
      request.onupgradeneeded = () => {
        for (const table of TABLES) {
          const options = table === 'outbox' ? { keyPath: 'order', autoIncrement: true } : { keyPath: 'id' };
          request.result.createObjectStore(table, options);
        }
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
      request.onblocked = () => reject(new Error('Veri deposu başka bir sekmede açık.'));
    });
  }

  const stores = new Map();

  async function open(profile) {
    const name = 'kelime-atlasi:v1:' + profile;
    if (stores.has(name)) return stores.get(name);
    const result = (async () => {
      try {
        if (localStorage.getItem(name)) return new TextStore(name, true);
      } catch { /* Try IndexedDB below. */ }
      try {
        return new IndexedStore(await openIDB(name));
      } catch {
        try {
          localStorage.setItem(name + ':check', '1');
          localStorage.removeItem(name + ':check');
          return new TextStore(name, true);
        } catch {
          return new TextStore(name, false);
        }
      }
    })();
    stores.set(name, result);
    return result;
  }

  function viewFrom(records) {
    const view = AtlasCore.createView(records);
    for (const op of records.outbox) AtlasCore.apply(view, op);
    return view;
  }

  async function synchronize(store, api) {
    const first = await store.pending();
    const orders = [], failures = [];
    for (let index = 0; index < first.outbox.length; index += 300) {
      const batch = first.outbox.slice(index, index + 300);
      const result = await api.push(batch.map(({ order, ...op }) => op));
      if (!Array.isArray(result)) throw new Error('Eşitleme yanıtı okunamadı.');
      failures.push(...result);
      for (const op of batch) orders.push(op.order);
    }

    let cursor = first.cursor;
    for (;;) {
      const page = await api.pull(cursor);
      if (!Array.isArray(page) || page.some(item => !COLLECTIONS.includes(item.kind) || !item.data ||
        !Number.isSafeInteger(item.data.revision) || item.data.revision <= cursor)) {
        throw new Error('Bulut verileri okunamadı.');
      }
      if (!page.length) break;
      await store.remote(page);
      cursor = page.at(-1).data.revision;
      if (page.length < 500) break;
    }
    if (orders.length) await store.acknowledge(orders);
    return { failures, changed: cursor !== first.cursor || orders.length > 0 };
  }

  return { open, viewFrom, synchronize };
})();

'use strict';

const AtlasCloud = (() => {
  const SETTINGS_KEY = 'kelime-atlasi:bulut:v1';
  const temporary = new Map();

  function read(key) {
    try { return JSON.parse(localStorage.getItem(key)) ?? temporary.get(key) ?? null; }
    catch { return temporary.get(key) ?? null; }
  }

  function save(key, value) {
    temporary.set(key, value);
    try {
      if (value === null) localStorage.removeItem(key);
      else localStorage.setItem(key, JSON.stringify(value));
    } catch { /* The current session can still use memory. */ }
  }

  function validateConfig(raw) {
    let url;
    try { url = new URL(String(raw?.url ?? '').trim()); }
    catch { throw new Error('Geçerli bir Supabase proje adresi gir.'); }
    const loopback = ['localhost', '127.0.0.1', '[::1]'].includes(url.hostname);
    if ((url.protocol !== 'https:' && !(loopback && url.protocol === 'http:')) ||
        url.pathname !== '/' || url.search || url.hash || url.username || url.password) {
      throw new Error('Supabase proje adresinin HTTPS ile başlaması ve yalnızca alan adını içermesi gerekiyor.');
    }
    const key = String(raw?.key ?? '').trim();
    let legacy = false;
    try {
      const parts = key.split('.');
      const claims = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
      legacy = parts.length === 3 && claims.role === 'anon';
    } catch { /* Publishable keys are not JWTs. */ }
    if (!/^sb_publishable_[A-Za-z0-9_-]+$/.test(key) && !legacy) {
      throw new Error('Supabase Publishable veya eski anon anahtarını gir.');
    }
    return { url: url.origin, key };
  }

  async function loadConfig() {
    const saved = read(SETTINGS_KEY);
    if (saved) return validateConfig(saved);
    if (!['http:', 'https:'].includes(location.protocol)) return null;
    try {
      const reply = await fetch(new URL('supabase-config.json', location.href), { signal: AbortSignal.timeout(5000) });
      if (!reply.ok) return null;
      const config = await reply.json();
      return config.url && config.key ? validateConfig(config) : null;
    } catch { return null; }
  }

  function configToStore(config) {
    save(SETTINGS_KEY, config);
  }

  function redirectUrl() {
    if (!['https:', 'http:'].includes(location.protocol)) return '';
    return location.origin + location.pathname;
  }

  function errorMessage(body, status) {
    const code = body.error_code || body.code || body.error;
    const messages = {
      invalid_credentials: 'E-posta adresini ve parolanı kontrol et.',
      email_not_confirmed: 'E-posta adresini doğruladıktan sonra giriş yap.',
      user_already_exists: 'Bu e-posta adresi için zaten bir hesap var.',
      weak_password: 'Daha güçlü bir parola seç.',
      over_email_send_rate_limit: 'E-posta gönderme sınırına ulaşıldı. Bir süre sonra tekrar dene.',
      over_request_rate_limit: 'Çok sayıda istek gönderildi. Bir süre sonra tekrar dene.',
      same_password: 'Önceki paroladan farklı bir parola seç.',
      validation_failed: 'E-posta adresini ve parola koşullarını kontrol et.',
      signup_disabled: 'Supabase projesinde e-posta ile hesap açma kapalı.',
      PGRST202: 'Supabase’de kurulum SQL’ini çalıştırıp tekrar eşitle.'
    };
    return messages[code] || (status === 401 ? 'Oturum veya Supabase anahtarı doğrulanamadı.' :
      status === 429 ? 'Çok sayıda istek gönderildi. Bir süre sonra tekrar dene.' :
      status >= 500 ? 'Bulut servisine geçici olarak ulaşılamıyor.' :
      'Bulut isteği tamamlanamadı (' + (code || status) + ').');
  }

  class Client {
    constructor(config) {
      this.config = config;
      this.sessionKey = 'kelime-atlasi:oturum:v1:' + config.url;
      this.session = read(this.sessionKey);
      this.refreshing = null;
    }

    keep(data, user = data.user) {
      if (!user?.id || !data.access_token || !data.refresh_token) {
        throw new Error('Hesap oturumu doğrulanamadı.');
      }
      this.session = {
        access_token: data.access_token,
        refresh_token: data.refresh_token,
        expires_at: Number(data.expires_at) || Math.floor(Date.now() / 1000) + (Number(data.expires_in) || 3600),
        user: { id: user.id, email: user.email }
      };
      save(this.sessionKey, this.session);
      return this.session;
    }

    async request(path, { method = 'POST', body, token } = {}) {
      const headers = { apikey: this.config.key, Accept: 'application/json' };
      if (body !== undefined) headers['Content-Type'] = 'application/json';
      if (token) headers.Authorization = 'Bearer ' + token;
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 18_000);
      try {
        let reply;
        try {
          reply = await fetch(this.config.url + path, {
            method, headers, body: body === undefined ? undefined : JSON.stringify(body),
            signal: controller.signal, cache: 'no-store', credentials: 'omit'
          });
        } catch {
          throw new Error('Buluta ulaşılamadı. İnternet bağlantını ve proje adresini kontrol et.');
        }
        const data = reply.status === 204 ? null : await reply.json().catch(() => null);
        if (!reply.ok) {
          const error = new Error(errorMessage(data || {}, reply.status));
          error.status = reply.status;
          error.code = data?.error_code || data?.code || data?.error;
          throw error;
        }
        return data;
      } finally {
        clearTimeout(timeout);
      }
    }

    authLink(path) {
      const target = redirectUrl();
      return '/auth/v1/' + path + (target ? '?redirect_to=' + encodeURIComponent(target) : '');
    }

    async signIn(email, password) {
      return this.keep(await this.request('/auth/v1/token?grant_type=password', { body: { email, password } }));
    }

    async signUp(email, password) {
      const result = await this.request(this.authLink('signup'), { body: { email, password } });
      return result?.access_token ? this.keep(result) : null;
    }

    async recover(email) {
      await this.request(this.authLink('recover'), { body: { email } });
    }

    async fromEmail(fragment) {
      const token = fragment.get('access_token');
      const user = await this.request('/auth/v1/user', { method: 'GET', token });
      return this.keep({
        access_token: token, refresh_token: fragment.get('refresh_token'),
        expires_in: fragment.get('expires_in')
      }, user);
    }

    async password(password) {
      await this.request('/auth/v1/user', { method: 'PUT', body: { password }, token: await this.token() });
    }

    async signOut() {
      const session = this.session;
      this.session = null;
      save(this.sessionKey, null);
      if (session && navigator.onLine) {
        this.request('/auth/v1/logout?scope=local', { token: session.access_token })
          .catch(() => { /* Local sign-out also works when the session has expired. */ });
      }
    }

    async token(rejected = '') {
      const fresh = () => {
        const saved = read(this.sessionKey);
        if (!saved || saved.user.id !== this.session?.user.id) throw new Error('Eşitleme için hesabına yeniden giriş yap.');
        this.session = saved;
        return saved.access_token !== rejected && saved.expires_at > Date.now() / 1000 + 60;
      };
      if (fresh()) return this.session.access_token;
      if (!this.refreshing) {
        const refresh = async () => {
          if (fresh()) return this.session.access_token;
          const previous = this.session.refresh_token;
          try {
            const data = await this.request('/auth/v1/token?grant_type=refresh_token', { body: { refresh_token: previous } });
            if (fresh() && this.session.refresh_token !== previous) return this.session.access_token;
            return this.keep(data, data.user || this.session.user).access_token;
          } catch (error) {
            if (fresh() && this.session.refresh_token !== previous) return this.session.access_token;
            if (['refresh_token_not_found', 'refresh_token_already_used', 'session_not_found'].includes(error.code)) {
              throw new Error('Oturum süresi doldu. Ayarlar’dan hesabına yeniden giriş yap.');
            }
            throw error;
          }
        };
        this.refreshing = (navigator.locks?.request('atlas-auth:' + this.config.url, refresh) ?? refresh())
          .finally(() => { this.refreshing = null; });
      }
      return this.refreshing;
    }

    async rpc(name, body) {
      const path = '/rest/v1/rpc/atlas_' + name;
      const token = await this.token();
      try {
        return await this.request(path, { body, token });
      } catch (error) {
        if (error.status !== 401) throw error;
        return this.request(path, { body, token: await this.token(token) });
      }
    }

    push(operations) { return this.rpc('push', { p_ops: operations }); }
    pull(cursor) { return this.rpc('pull', { p_after: cursor, p_limit: 500 }); }
    profile() { return 'account:' + this.config.url + ':' + this.session.user.id; }
  }

  return { Client, loadConfig, validateConfig, configToStore, read, save };
})();

    shuffle: '<path d="M3 6h3c5 0 6 12 12 12h3m-4-4 4 4-4 4m0-20 4 4-4 4M3 18h3c2 0 3-2 4-4m4-4c1-2 2-4 4-4h3"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/>',
    folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>'
  };

  const NAV = {
    home: ['Ana Sayfa', 'Ana Sayfa', 'home'],
    test: ['Test Çöz', 'Test Çöz', 'bolt'],
    words: ['Kelime Havuzum', 'Havuz', 'layers'],
    wrong: ['Yanlışlarım', 'Yanlışlar', 'circle-x'],
    stats: ['İstatistikler', 'İstatistik', 'chart'],
    settings: ['Ayarlar', 'Ayarlar', 'settings']
  };
  const number = new Intl.NumberFormat('tr-TR');
  const dateLong = new Intl.DateTimeFormat('tr-TR', {
    timeZone: AtlasCore.ZONE, weekday: 'long', day: 'numeric', month: 'long'
  });
  const dateShort = new Intl.DateTimeFormat('tr-TR', {
    timeZone: AtlasCore.ZONE, day: 'numeric', month: 'short'
  });
  const weekDay = new Intl.DateTimeFormat('tr-TR', { timeZone: AtlasCore.ZONE, weekday: 'short' });
  const amount = value => number.format(value);
  const pct = value => '%' + amount(Math.round(value * 100));

  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
  }

  function icon(name) {
    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name] || paths.info}</svg>`;
  }

  function button(label, action, style = 'primary', glyph = '', extra = '') {
    return `<button type="button" class="btn ${style}" data-action="${action}" ${extra}>${glyph ? icon(glyph) : ''}${label}</button>`;
  }

  function iconButton(label, action, glyph, extra = '') {
    return `<button type="button" class="icon-btn" aria-label="${esc(label)}" title="${esc(label)}" data-action="${action}" ${extra}>${icon(glyph)}</button>`;
  }

  function pageHeader(title, text, actions = '') {
    return `<header class="page-head"><div><h1>${title}</h1>${text ? `<p>${text}</p>` : ''}</div>${actions ? `<div class="actions">${actions}</div>` : ''}</header>`;
  }

  function tile(glyph, color = '') {
    return `<span class="tile-icon ${color}">${icon(glyph)}</span>`;
  }

  function metric(label, value, detail, glyph, color) {
    return `<article class="metric"><div class="metric-label">${tile(glyph, color)}${label}</div><strong>${value}</strong><small>${detail}</small></article>`;
  }

  function empty(glyph, title, message, action = '') {
    return `<div class="empty">${tile(glyph)}<h3>${title}</h3><p>${message}</p>${action}</div>`;
  }

  function brand() {
    return `<button class="brand" type="button" data-action="navigate" data-page="home" aria-label="Kelime Atlası ana sayfası">
      <span class="brand-icon">${icon('book')}</span><span class="brand-copy"><strong>Kelime Atlası</strong><small>YÖKDİL Sosyal Bilimler</small></span></button>`;
  }

  function navLink(page, state, mobile = false) {
    const [label, short, glyph] = NAV[page];
    const selected = state.page === page;
    return `<button class="nav-link" type="button" data-action="navigate" data-page="${page}" title="${label}" aria-label="${label}" ${selected ? 'aria-current="page"' : ''}>
      ${icon(glyph)}<span class="nav-label">${mobile ? short : label}</span>
      ${page === 'test' && !mobile && state.active && !state.active.finished ? '<span class="nav-count">Sürüyor</span>' : ''}
    </button>`;
  }

  function cloudChip(state) {
    const sync = state.sync;
    let status = 'local', label = 'Yerel çalışma', glyph = 'cloud';
    if (state.client?.session) {
      if (sync.running) { status = 'busy'; label = 'Eşitleniyor'; glyph = 'sync'; }
      else if (sync.error) { status = 'error'; label = 'Eşitleme bekliyor'; }
      else if (sync.pending) { status = 'busy'; label = 'Kayıtlar bekliyor'; glyph = 'sync'; }
      else if (sync.last) { status = 'ok'; label = 'Buluta kaydedildi'; }
      else { status = 'busy'; label = 'Bulut hesabı'; }
    }
    return `<button class="sync-chip" type="button" data-action="navigate" data-page="settings" data-state="${status}" title="Eşitleme ayarlarını aç">${icon(glyph)}${label}</button>`;
  }

  function shell(state) {
    const email = state.client?.session?.user.email;
    const mobile = Object.keys(NAV).map(page => navLink(page, state, true)).join('');
    const dark = state.effectiveTheme === 'dark';
    const content = {
      home: home, test: test, words: words, wrong: wrongs, stats: statistics, settings
    }[state.page](state);
    return `<div class="shell">
      <aside class="sidebar">${brand()}<nav class="nav" aria-label="Ana menü">${['home','test','words','wrong','stats'].map(page => navLink(page, state)).join('')}</nav>
        <div class="side-bottom">${navLink('settings', state)}
          <button type="button" class="profile" data-action="navigate" data-page="settings" aria-label="Hesap ayarları">
            <span class="avatar">${email ? esc(email[0].toLocaleUpperCase('tr')) : icon('book')}</span>
            <span class="identity"><strong>${esc(email || 'Kişisel çalışma alanı')}</strong><small>${email ? 'Bulut hesabı' : 'Bu cihazda'}</small></span>${icon('chevron')}
          </button>
        </div>
      </aside>
      <div>
        <header class="top"><span class="top-title">${NAV[state.page][0]}</span><div class="top-brand">${brand()}</div>
          <div class="top-tools"><div id="cloud-chip">${cloudChip(state)}</div>${iconButton(dark ? 'Açık temaya geç' : 'Koyu temaya geç', 'theme', dark ? 'sun' : 'moon')}</div>
        </header>
        <main id="main" tabindex="-1">${state.storageKind === 'memory' ? '<p class="notice" role="alert">Tarayıcı kayıt alanını açamadı. Yerel değişiklikler bu oturumla sınırlı. Verilerini yedekle.</p>' : ''}${content}</main>
      </div>
      <nav class="mobile-nav" aria-label="Mobil ana menü">${mobile}</nav>
    </div>`;
  }

  function chart(data, span) {
    const days = Array.from({ length: span }, (_, index) => {
      const day = AtlasCore.shiftDay(data.today, index - span + 1);
      return { day, ...data.daily.get(day) };
    });
    const active = days.filter(day => day.correct || day.wrong);
    const max = Math.max(4, ...active.map(day => day.correct + day.wrong));
    const axis = Math.ceil(max / 4) * 4;
    const bars = days.map(({ day, correct = 0, wrong = 0 }, index) => {
      const date = new Date(day + 'T12:00:00Z');
      const total = correct + wrong;
      const height = Math.round(total / axis * 100);
      const label = span === 7 ? weekDay.format(date) : ([2, 9, 16, 23, 28].includes(index) ? dateShort.format(date) : '');
      const description = dateShort.format(date) + ' · ' + amount(correct) + ' doğru, ' + amount(wrong) + ' yanlış';
      return `<button type="button" class="bar" data-action="chart-day" data-description="${esc(description)}" aria-label="${esc(description)}" title="${esc(description)}"><span class="bar-fill ${total ? 'has-data' : ''}" style="--height:${Math.round(height * .85)}%;--correct:${total ? correct / total * 100 : 0}%"><i></i></span><small>${esc(label)}</small></button>`;
    }).join('');
    return `<section class="panel chart-panel"><div class="panel-head"><div><h2>Çalışma grafiği</h2><p>Günlük doğru ve yanlış cevaplar</p></div>
      <div class="segmented" aria-label="Grafik dönemi">${[7,30].map(period => `<button type="button" data-action="chart-span" data-days="${period}" aria-pressed="${period === span}">${period} gün</button>`).join('')}</div></div>
      <div class="chart" data-period="${span}" aria-label="Günlük cevap grafiği"><div class="chart-axis" aria-hidden="true">${[1,.75,.5,.25,0].map(step => `<div class="chart-tick"><span>${amount(axis * step)}</span><i></i></div>`).join('')}</div><div class="chart-bars" style="--count:${span}">${bars}</div></div>
      <div class="chart-legend"><span><i></i>Doğru</span><span><i></i>Yanlış</span></div>
      <p class="chart-tooltip" id="chart-detail" aria-live="polite">${active.length ? 'Bir günü seçerek ayrıntıyı gör.' : 'İlk testini çözdüğünde cevapların burada görünecek.'}</p></section>`;
  }

  function plan(data) {
    const fresh = Math.min(data.unseen, Math.max(0, AtlasCore.NEW_PER_DAY - data.activity.first));
    const today = data.activity.correct + data.activity.wrong;
    const goal = today + data.due + fresh;
    return `<section class="panel">
      <div class="panel-head"><div><h2>Bugünkü çalışma</h2><p>Aralıklı tekrar planın</p></div>${tile('calendar', 'orange')}</div>
      <div class="plan-summary">
        <div class="plan-ring" style="--fill:${goal ? 100 * today / goal : 0}%" aria-hidden="true"><span>${amount(today)}</span></div>
        <div><strong>${amount(today)} cevap</strong><p>${amount(data.due + fresh)} kelime çalışma için hazır</p></div>
      </div>
      <button type="button" class="plan-link" data-action="mode" data-mode="due">${icon('clock')}<span>Tekrar zamanı gelenler</span><b>${amount(data.due)}</b>${icon('chevron')}</button>
      <button type="button" class="plan-link" data-action="mode" data-mode="due">${icon('spark')}<span>Bugünkü yeni kelimeler</span><b>${amount(fresh)}</b>${icon('chevron')}</button>
    </section>`;
  }

  function home(state) {
    const d = state.data;
    const hasTest = state.active && !state.active.finished;
    return `<section class="hero"><div class="hero-copy">
      <div class="context">${icon('spark')} YÖKDİL Sosyal Bilimler</div>
      <h1>Kelime çalışma alanın</h1>
      <p>Kelimelerini bir araya getir, dört seçenekli testler çöz ve zamanı gelenleri tekrar et.</p>
      <div class="hero-actions">
        ${button(hasTest ? 'Teste Devam Et' : 'Test Çöz', 'navigate', 'primary', 'bolt', 'data-page="test"')}
        ${button('Kelime Ekle', 'add', 'secondary', 'plus')}
      </div>
    </div><div class="art" aria-hidden="true">
      <div class="art-ring"></div><div class="flash back"><span class="letters">Çç</span><span class="art-text">TÜRKÇE</span></div>
      <div class="flash front"><span class="letters">Aa</span><span class="art-text">ENGLISH</span></div>
      <span class="art-spark">${icon('spark')}</span><span class="art-spark two">${icon('spark')}</span><i class="art-dot"></i>
    </div></section>
    <div class="section-title"><h2>Genel bakış</h2><span class="overview-date">${icon('calendar')}${esc(dateLong.format(new Date()))}</span></div>
    <div class="metrics">
      ${metric('Toplam kelime', amount(d.live.length), amount(d.unseen) + ' kelime henüz çalışılmadı', 'layers', '')}
      ${metric('Öğrenilen', amount(d.learned), amount(d.learning) + ' kelime öğreniliyor', 'circle', 'green')}
      ${metric('Genel başarı', pct(d.rate), amount(d.correct) + ' doğru · ' + amount(d.wrong) + ' yanlış', 'target', 'blue')}
      ${metric('Çalışma serisi', amount(d.chain) + ' gün', amount(d.total) + ' toplam cevap', 'flame', 'orange')}
    </div>
    <div class="dashboard-grid">${chart(d, state.span)}${plan(d)}</div>`;
  }

  function wordTable(state) {
    const query = AtlasCore.turkishKey(state.query);
    const candidates = state.data.live.filter(word => !query ||
      AtlasCore.turkishKey(word.english).includes(query) || AtlasCore.turkishKey(word.turkish).includes(query));
    const sort = {
      newest: (a,b) => Date.parse(b.created_at) - Date.parse(a.created_at) || a.english.localeCompare(b.english, 'en'),
      alphabet: (a,b) => a.english.localeCompare(b.english, 'en'),
      review: (a,b) => (state.data.progress.get(a.id)?.due ?? Infinity) - (state.data.progress.get(b.id)?.due ?? Infinity) ||
        a.english.localeCompare(b.english, 'en')
    }[state.wordSort];
    candidates.sort(sort);
    const size = 30;
    const pages = Math.max(1, Math.ceil(candidates.length / size));
    const current = Math.min(state.wordPage, pages);
    if (!candidates.length) {
      return query ? empty('search', 'Sonuç bulunamadı', 'Başka bir kelime veya karşılık ara.') :
        empty('layers', 'Havuzun boş', 'Tek bir kelime ekle veya Numbers dosyanı içe aktar.', button('Kelime Ekle', 'add', 'primary', 'plus'));
    }
    const rows = candidates.slice((current - 1) * size, current * size).map(word => {
      const result = state.data.progress.get(word.id);
      const level = !result ? ['','Çalışılmadı'] : result.streak >= 5 ? ['learned','Öğrenildi'] : ['learning','Öğreniliyor'];
      const id = 'data-id="' + esc(word.id) + '"';
      return `<tr><td><strong lang="en">${esc(word.english)}</strong><small>${dateShort.format(new Date(word.created_at))}</small></td>
        <td class="translation">${esc(word.turkish)}</td>
        <td class="wide-cell"><span class="state-pill ${level[0]}">${level[1]}</span></td>
        <td class="row-actions">${iconButton('Düzenle: ' + word.english, 'edit', 'edit', id)}${iconButton('Sil: ' + word.english, 'delete', 'trash', id)}</td></tr>`;
    }).join('');
    return `<table class="pool-table"><colgroup><col style="width:30%"><col><col class="wide-cell" style="width:18%"><col style="width:83px"></colgroup>
      <thead><tr><th scope="col">İngilizce</th><th scope="col">Türkçe</th><th scope="col" class="wide-cell">Durum</th><th scope="col"><span class="sr-only">İşlemler</span></th></tr></thead>
      <tbody>${rows}</tbody></table>
      <div class="pagination"><span>${amount(candidates.length)} kelime · ${amount(current)} / ${amount(pages)}</span>
      <div class="actions">${button('Önceki', 'word-page', 'secondary sm', '', `data-index="${current-1}" ${current <= 1 ? 'disabled' : ''}`)}
      ${button('Sonraki', 'word-page', 'secondary sm', '', `data-index="${current+1}" ${current >= pages ? 'disabled' : ''}`)}</div></div>`;
  }

  function words(state) {
    return `${pageHeader('Kelime Havuzum', amount(state.data.live.length) + ' kayıtlı kelime',
      button('İçe Aktar', 'import', 'secondary', 'upload') + button('Kelime Ekle', 'add', 'primary', 'plus'))}
      <section class="panel"><div class="pool-tools">
        <label class="search-field">${icon('search')}<span class="sr-only">İngilizce veya Türkçe ara</span><input id="word-search" type="search" placeholder="İngilizce veya Türkçe ara" value="${esc(state.query)}"></label>
        <select id="word-sort" aria-label="Kelimeleri sırala">${[['newest','Son eklenen'],['alphabet','A–Z'],['review','Tekrar tarihi']].map(([value,label]) => `<option value="${value}" ${state.wordSort === value ? 'selected' : ''}>${label}</option>`).join('')}</select>
      </div><div id="word-table">${wordTable(state)}</div>
      <div class="actions" style="margin-top:13px">${button('CSV indir', 'export-csv', 'ghost sm', 'download')}${button('Excel indir', 'export-xlsx', 'ghost sm', 'download')}</div></section>`;
  }

  function setup(state) {
    const modeOptions = Object.entries(AtlasCore.MODES).map(([id,[label, detail, glyph]]) =>
      `<label class="mode-choice">${tile(glyph)}<span><strong>${label}</strong><small>${detail}</small></span>
      <input type="radio" name="mode" value="${id}" ${state.mode === id ? 'checked' : ''}></label>`).join('');
    return `<div class="test-layout">${pageHeader('Test Çöz', 'Çalışmak istediğin kelimeleri ve soru sayısını seç.')}
      <section class="panel"><form id="test-form" class="test-setup">
        <div><h2>Test türü</h2><div class="mode-options">${modeOptions}</div></div>
        <div><h2>Soru sayısı</h2><div class="counts" role="group" aria-label="Soru sayısı">${['10','20','30','50','100','custom'].map(value =>
          `<label class="count-pill"><input class="sr-only" type="radio" name="count" value="${value}" ${state.count === value ? 'checked' : ''}>${value === 'custom' ? 'Özel sayı' : value}</label>`).join('')}</div>
          <input id="custom-count" class="field custom-count" type="number" name="custom" min="1" step="1" value="${esc(state.custom)}" aria-label="Özel soru sayısı" ${state.count !== 'custom' ? 'hidden disabled' : 'required'}>
          <p class="test-info" id="test-availability">${availability(state)}</p>
        </div><div class="actions"><button type="submit" class="btn primary">${icon('bolt')} Teste Başla</button></div>
      </form></section></div>`;
  }

  function availability(state) {
    let total = AtlasCore.eligible(state.data, state.mode).length;
    if (state.mode === 'due') total = state.data.due + Math.min(state.data.unseen, Math.max(0, AtlasCore.NEW_PER_DAY - state.data.activity.first));
    return total ? amount(total) + ' aday kelime var. Yeterli şık bulunan kelimelerle test hazırlanır.' : 'Bu test türüne uygun kelime bulunamadı.';
  }

  function question(state) {
    const active = state.active;
    const current = active.questions[active.position];
    const result = active.results[current.id];
    const reported = result?.reported || state.view.reports.has(current.id);
    const answered = !!result || reported;
    const progress = active.position + Number(answered);
    const count = active.questions.length;
    const correct = result?.selected === current.correct;
    const choices = current.choices.map((label, index) => {
      let style = '';
      if (answered && index === current.correct) style = 'good';
      else if (answered && result?.selected === index && !reported) style = 'bad';
      return `<button type="button" class="choice ${style}" data-action="answer" data-index="${index}" ${answered ? 'disabled' : ''}>
        <b aria-hidden="true">${'ABCD'[index]}</b><span>${esc(label)}</span>${style ? `<span class="sr-only">${style === 'good' ? 'Doğru seçenek' : 'Yanlış seçenek'}</span>` : ''}</button>`;
    }).join('');
    const message = reported ? 'Soru işaretlendi ve puan hesabından çıkarıldı.' :
      correct ? 'Doğru. ' + current.turkish : 'Yanlış. Doğru karşılık: ' + current.turkish;
    return `<div class="test-layout">
      <div class="test-progress"><span>${AtlasCore.MODES[active.mode][0]} · Soru ${amount(active.position+1)} / ${amount(count)}</span>
      ${button('Testi bitir', 'end-test', 'ghost sm')}</div>
      <div class="progress-track" role="progressbar" aria-label="Test ilerlemesi" aria-valuenow="${progress}" aria-valuemin="0" aria-valuemax="${count}"><span style="width:${progress/count*100}%"></span></div>
      <section class="panel question-card" aria-labelledby="question-word">
        <p class="subtext">Türkçe karşılığı hangisi?</p><h1 id="question-word" lang="en" tabindex="-1">${esc(current.english)}</h1>
        <div class="choices" aria-label="Cevap seçenekleri">${choices}</div>
        ${answered ? `<p class="feedback ${reported ? 'reported' : correct ? 'good' : 'bad'}" role="status">${icon(reported ? 'flag' : correct ? 'check' : 'circle-x')}${esc(message)}</p>` : ''}
        <div class="question-actions">${button('Hatalı soruyu işaretle', 'report', 'ghost sm', 'flag', reported ? 'disabled' : '')}
          ${button(active.position + 1 < count ? 'Sonraki soru' : 'Sonucu gör', 'next', 'primary', 'arrow', answered ? '' : 'disabled')}</div>
      </section></div>`;
  }

  function result(state) {
    const active = state.active;
    const entries = Object.entries(active.results);
    const reported = entries.filter(([id, value]) => value.reported || state.view.reports.has(id)).length;
    const correct = entries.filter(([id, value]) => !value.reported && !state.view.reports.has(id) && value.correct).length;
    const wrong = entries.length - correct - reported;
    const total = correct + wrong;
    return `<div class="test-layout">
      ${pageHeader('Test sonucu', AtlasCore.MODES[active.mode][0] + ' · ' + amount(total) + ' puanlanan cevap' + (reported ? ' · ' + amount(reported) + ' işaretlenen soru' : ''))}
      <section class="panel result"><div class="metrics">
        ${metric('Başarı', pct(total ? correct/total : 0), 'Bu test', 'target', '')}
        ${metric('Doğru', amount(correct), 'Doğru cevap', 'circle', 'green')}
        ${metric('Yanlış', amount(wrong), 'Yanlış cevap', 'circle-x', 'red')}
        ${metric('Yanıtlanmayan', amount(active.questions.length - entries.length), 'Boş soru', 'clock', 'orange')}
      </div><div class="actions">${button('Yeni Test', 'clear-test', 'primary', 'bolt')}${button('Yanlışlarım', 'navigate', 'secondary', 'circle-x', 'data-page="wrong"')}</div></section></div>`;
  }

  function test(state) {
    if (!state.active) return setup(state);
    return state.active.finished ? result(state) : question(state);
  }

  function wrongList(state) {
    const words = AtlasCore.eligible(state.data, 'wrong');
    if (!words.length) return empty('circle-x', 'Henüz yanlış cevap yok', 'Çözdüğün testlerde yanlış cevapladığın kelimeler burada birikir.', button('Test Çöz', 'navigate', 'primary', 'bolt', 'data-page="test"'));
    const size = 30;
    const pages = Math.ceil(words.length / size);
    const page = Math.min(state.wrongPage, pages);
    const items = words.slice((page-1)*size,page*size).map(word => {
      const record = state.data.progress.get(word.id);
      return `<div class="wrong-row">${tile('circle-x', 'red')}<div><strong lang="en">${esc(word.english)}</strong><p>${esc(word.turkish)}</p></div>
        <div class="wrong-detail">${amount(record.wrong)} yanlış<br>${pct(record.rate)} başarı</div></div>`;
    }).join('');
    return items + `<div class="pagination"><span>${amount(words.length)} kelime · ${amount(page)} / ${amount(pages)}</span>
      <div class="actions">${button('Önceki', 'wrong-page', 'secondary sm', '', `data-index="${page-1}" ${page <= 1 ? 'disabled' : ''}`)}
      ${button('Sonraki', 'wrong-page', 'secondary sm', '', `data-index="${page+1}" ${page >= pages ? 'disabled' : ''}`)}</div></div>`;
  }

  function wrongs(state) {
    return `${pageHeader('Yanlışlarım', 'Yanlış cevapladığın kelimeleri gözden geçir.',
      button('Yanlışlardan Test Çöz', 'mode', 'primary', 'bolt', 'data-mode="wrong"'))}<section class="panel">${wrongList(state)}</section>`;
  }

  function statistics(state) {
    const d = state.data;
    const list = [
      ['Toplam kelime', d.live.length], ['Öğrenilen', d.learned], ['Öğreniliyor', d.learning],
      ['Henüz çalışılmadı', d.unseen], ['Tekrar zamanı geldi', d.due]
    ];
    return `${pageHeader('İstatistikler', 'Öğrenme geçmişin ve kelime seviyelerin.')}
      <div class="metrics">
        ${metric('Çözülen soru', amount(d.total), amount(d.activity.correct+d.activity.wrong) + ' cevap bugün', 'layers', '')}
        ${metric('Doğru cevap', amount(d.correct), pct(d.rate) + ' genel başarı', 'circle', 'green')}
        ${metric('Yanlış cevap', amount(d.wrong), 'Tüm çalışma geçmişi', 'circle-x', 'red')}
        ${metric('Çalışma serisi', amount(d.chain) + ' gün', 'Ardışık çalışma günleri', 'flame', 'orange')}
      </div>
      <div class="dashboard-grid">${chart(d, state.span)}<section class="panel"><h2>Kelime seviyeleri</h2>
      <div class="stat-list">${list.map(([label,value]) => `<div><span>${label}</span><strong>${amount(value)}</strong></div>`).join('')}</div></section></div>`;

  function settings(state) {

      : email
      ? `<p class="account-email">${esc(email)}</p><p class="subtext">${sync.error ? esc(sync.error) : sync.last ? 'Son eşitleme ' + esc(new Date(sync.last).toLocaleString('tr-TR', { timeZone: AtlasCore.ZONE })) : 'Kelimeler ve cevaplar bulut hesabına kaydedilir.'}</p>

         <div class="actions" style="margin-top:12px">${button('Şimdi Eşitle', 'sync', 'primary', 'sync', sync.running ? 'disabled' : '')}
           ${button('Yeniden Giriş', 'reauth', 'secondary')}${button('Çıkış Yap', 'signout', 'ghost')}</div>
         ${state.hasLocal ? `<p class="subtext" style="margin-top:11px">Bu cihazdaki yerel havuzu ve geçmişi bulut hesabına ekleyebilirsin.</p>
         ${button('Yerel Çalışmayı Hesaba Ekle', 'copy-local', 'secondary sm', 'upload', 'style="margin-top:7px"')}` : ''}`

         <label class="field-label">E-posta<input class="field" type="email" name="email" autocomplete="email" required></label>
         <label class="field-label">Parola<input class="field" type="password" name="password" autocomplete="current-password" required></label>

      <div class="settings-grid"><section class="panel"><h2>Bulut hesabı</h2>${account}
